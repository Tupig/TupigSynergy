name: "Test Package"
description: "Audits extracted package dependencies and launches with isolated runtime settings"

inputs:
  like:
    description: "Linux distribution family used to select the package format"
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - name: Verify Windows MSI and portable payloads
      if: ${{ runner.os == 'Windows' }}
      shell: cmd
      working-directory: .
      run: call scripts\ci\verify-package-windows.bat build

    - name: Verify macOS DMG payload
      if: ${{ runner.os == 'macOS' }}
      shell: bash
      working-directory: .
      run: bash scripts/ci/verify-package-macos.sh build

    - name: Verify Linux package payload
      if: ${{ runner.os == 'Linux' }}
      shell: bash
      working-directory: .
      env:
        PACKAGE_LINUX_LIKE: ${{ inputs.like }}
      run: bash scripts/ci/verify-package-linux.sh build "$PACKAGE_LINUX_LIKE"

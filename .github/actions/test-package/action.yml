name: "Test Package"
description: "Audits extracted package dependencies and launches with isolated runtime settings"

inputs:
  expected-arch:
    description: "Declared build target: x64 or arm64; macOS may declare both comma separated"
    required: true
  like:
    description: "Linux distribution family used to select the package format"
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - name: Verify Windows MSI and portable payloads
      if: ${{ runner.os == 'Windows' }}
      shell: cmd
      working-directory: .
      env:
        PACKAGE_EXPECTED_ARCH: ${{ inputs.expected-arch }}
      run: call scripts\ci\verify-package-windows.bat build "%PACKAGE_EXPECTED_ARCH%"

    - name: Verify macOS DMG payload
      if: ${{ runner.os == 'macOS' }}
      shell: bash
      working-directory: .
      env:
        PACKAGE_EXPECTED_ARCH: ${{ inputs.expected-arch }}
      run: bash scripts/ci/verify-package-macos.sh --expected-arch "$PACKAGE_EXPECTED_ARCH" build

    - name: Verify Linux package payload
      if: ${{ runner.os == 'Linux' }}
      shell: bash
      working-directory: .
      env:
        PACKAGE_LINUX_LIKE: ${{ inputs.like }}
        PACKAGE_EXPECTED_ARCH: ${{ inputs.expected-arch }}
      run: bash scripts/ci/verify-package-linux.sh --expected-arch "$PACKAGE_EXPECTED_ARCH" build "$PACKAGE_LINUX_LIKE"

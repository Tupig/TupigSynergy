name: "Install dependencies for Synergy"
description: "Install the dependencies needed to build Synergy"

inputs:
  like:
    description: "Used only on linux distro type: debian, fedora, suse, arch"
    required: false

  qt-version:
    description: "The version of Qt to install (Windows & macOS)"
    required: false

  vcpkg-triplet:
    description: "vcpkg triplet to use (Windows)"
    required: false

outputs:
  vcpkg-cmake-config:
    description: "windows vcpkg output for cmaket"
    value: ${{ steps.vcpkg.outputs.vcpkg-cmake-config }}
  qt-notice-root:
    description: "Verified selected prebuilt Qt source notices"
    value: ${{ steps.qt-notices-windows.outputs.root || steps.qt-notices-macos.outputs.root }}
  qt-notice-sha256:
    description: "Original collection manifest SHA256"
    value: ${{ steps.qt-notices-windows.outputs.sha256 || steps.qt-notices-macos.outputs.sha256 }}

runs:
  using: "composite"

  steps:
    - name: Install Depends
      if: ${{ runner.os != 'Windows' }}
      run: |
          if [ "$RUNNER_OS" == "macOS" ]; then
            brew install openssl openssl@3 doxygen --quiet
          elif [ "$RUNNER_OS" == "Linux" ]; then
            if [ ${{inputs.like}} == "debian" ]; then
              apt-get update -qqq > /dev/null
              # qt6-l10n-tools + qt6-tools-dev-tools provide lconvert/lupdate/lrelease that
              # qt6-tools-dev's LinguistTools cmake references but doesn't always pull in.
              apt-get install -qqq cmake build-essential ninja-build patchelf binutils python3 \
                xorg-dev libx11-dev libxtst-dev libssl-dev \
                libgl-dev libglx-dev libopengl-dev \
                libglib2.0-dev libxkbfile-dev qt6-base-dev qt6-tools-dev libqt6svg6 \
                qt6-l10n-tools qt6-tools-dev-tools \
                libgtk-3-dev \
                help2man doxygen -y >/dev/null
              # Bookworm/Noble ship SVG plugins in libqt6svg6; newer distros
              # split them into qt6-svg-plugins. Packaging checks the actual .so.
              if apt-cache show qt6-svg-plugins >/dev/null 2>&1; then
                apt-get install -qqq qt6-svg-plugins -y >/dev/null
              fi
              # Qt5 fallback for distros whose Qt6 is below REQUIRED_QT_VERSION
              # (debian-12 / ubuntu-24.04 ship 6.4.x < 6.7.0): find_qt_with_fallback
              # probes Qt5 when system Qt6 is too old. Harmless when Qt6 qualifies.
              # Installed after Qt6 so it never shadows a working Qt6 find.
              apt-get install -qqq qtbase5-dev libqt5svg5 -y >/dev/null
              # On slim images qt6-base-dev can fail its CMake component probe when
              # OpenGL is absent (Qt6Gui -> OpenGL), silently selecting Qt5 and
              # then colliding with the Qt6::* ALIAS targets (debian-13 Configure).
              # Keep libgl-dev above; this line is a no-op if the distro already
              # satisfies it via qt6-base-dev dependencies.
              apt-get install -qqq libgl-dev -y >/dev/null || true
              # qtbase_en.qm (Qt's own catalogue, required by translations/CMakeLists.txt)
              # ships in a separate package on Debian/Ubuntu; install whichever exists.
              for pkg in qt6-translations qt6-l10n; do
                if apt-cache show "$pkg" >/dev/null 2>&1; then
                  apt-get install -qqq "$pkg" -y >/dev/null
                fi
              done
              # libei/libportal aren't packaged on older releases (e.g. Debian 12); install
              # where present, else the build falls back to X11-only.
              for pkg in libei-dev libportal-dev; do
                if apt-cache show "$pkg" >/dev/null 2>&1; then
                  apt-get install -qqq "$pkg" -y >/dev/null
                fi
              done
            elif [ ${{inputs.like}} == "fedora" ]; then
              # The container excludes %doc by default; libglvnd embeds its
              # runtime notices in its package-owned README.
              dnf install -y --setopt=tsflags= cmake make ninja-build gcc-c++ rpm-build openssl-devel patchelf binutils python3 \
                glib2-devel libXtst-devel libxkbfile-devel qt6-qtbase-devel qt6-qttools-devel \
                qt6-qttranslations qt6-qtsvg \
                gtk3-devel libei-devel libportal-devel help2man doxygen
              if [ ! -s /usr/share/doc/libglvnd/README.md ]; then
                dnf reinstall -y --setopt=tsflags= \
                  "libglvnd-$(rpm -q --qf '%{VERSION}-%{RELEASE}.%{ARCH}' libglvnd)"
              fi
              test -s /usr/share/doc/libglvnd/README.md
            elif [ ${{inputs.like}} == "suse" ]; then
              # Override the image vendor drop-in before dependency install.
              mkdir -p /etc/zypp/zypp.conf.d
              printf '[main]\nrpm.install.excludedocs = no\n' > /etc/zypp/zypp.conf.d/excludedocs.conf
              zypper refresh
              zypper install -y --force-resolution \
                cmake make ninja gcc-c++ rpm-build libopenssl-devel patchelf binutils python3 \
                glib2-devel libXtst-devel libxkbfile-devel qt6-base-devel qt6-tools-devel \
                qt6-linguist-devel qt6-translations libQt6Svg6 \
                gtk3-devel doxygen \
                libei-devel libportal-devel help2man
              if [ ! -s /usr/share/doc/packages/libglvnd/README.md ]; then
                zypper install -y --force \
                  "libglvnd.$(rpm -q --qf '%{ARCH}' libglvnd)=$(rpm -q --qf '%{VERSION}-%{RELEASE}' libglvnd)"
              fi
              test -s /usr/share/doc/packages/libglvnd/README.md
            elif [ ${{ inputs.like }} == "arch" ]; then
              pacman -Syu --noconfirm base-devel cmake ninja patchelf binutils python \
                gcc openssl glib2 libxtst libxkbfile libei libportal \
                qt6-base qt6-tools qt6-svg qt6-translations qt6-declarative gtk3 help2man doxygen graphviz rsync
            elif [ ${{ inputs.like }} == "rhel" ]; then
              # el8: Qt5 + X11 only (no Qt6, no libei/libportal); tests and translations are
              # off so no qttools. -devel packages live in the CodeReady Builder repo
              # (powertools on el8).
              dnf install -y 'dnf-command(config-manager)'
              dnf install -y epel-release
              dnf config-manager --set-enabled powertools 2>/dev/null \
                || dnf config-manager --set-enabled crb 2>/dev/null || true
              dnf install -y \
                cmake make ninja-build rpm-build help2man patchelf binutils python3 \
                gcc-toolset-13 \
                openssl-devel glib2-devel \
                libX11-devel libXext-devel libXtst-devel libXrandr-devel \
                libXinerama-devel libXi-devel libxkbfile-devel \
                qt5-qtbase-devel qt5-qtsvg gtk3-devel
            else
              echo "Unknown like"
            fi
          else
            echo "Unknown OS: $RUNNER_OS"
          fi
      shell: bash

    # el8's system GCC 8 can't build C++20, so use gcc-toolset-13. It links the newer libstdc++
    # bits statically (libstdc++_nonshared) over the stable system ABI, so the binary still runs
    # on stock el8. cmake comes from the distro (the project floor is lowered to match).
    - name: Setup RHEL toolchain
      if: ${{ inputs.like == 'rhel' }}
      shell: bash
      run: |
        toolset=/opt/rh/gcc-toolset-13/root/usr
        echo "${toolset}/bin" >> "$GITHUB_PATH"
        echo "CC=${toolset}/bin/gcc" >> "$GITHUB_ENV"
        echo "CXX=${toolset}/bin/g++" >> "$GITHUB_ENV"
        echo "LD_LIBRARY_PATH=${toolset}/lib64" >> "$GITHUB_ENV"

    - name: Install Qt
      if: ${{runner.os != 'Linux' }}
      uses: jurplel/install-qt-action@a9c63c7c123f3069cff414e7e482d95dfa9d8125 # v4
      env:
        AQT_CONFIG: ${{ github.workspace }}/.github/actions/install-dependencies/aqt.ini
      with:
        version: ${{inputs.qt-version}}
        cache: true
        cache-key-prefix: ${{matrix.target.name}}-${{inputs.qt-version}}

    - name: Prepare selected Qt notices on Windows
      if: ${{ runner.os == 'Windows' }}
      id: qt-notices-windows
      shell: cmd
      run: call scripts\ci\prepare-qt-notices.bat "%QT_ROOT_DIR%" "${{ inputs.qt-version }}" "${{ runner.temp }}\qt-source-cache" "${{ runner.temp }}\qt-notices" "%GITHUB_OUTPUT%"

    - name: Prepare selected Qt notices on macOS
      if: ${{ runner.os == 'macOS' }}
      id: qt-notices-macos
      shell: bash
      run: python3 scripts/ci/collect-qt-notices.py --sdk-root "$QT_ROOT_DIR" --version "${{ inputs.qt-version }}" --cache "${{ runner.temp }}/qt-source-cache" --output "${{ runner.temp }}/qt-notices" --github-output "$GITHUB_OUTPUT"

    - name: Build and cache vcpkg
      if: ${{ runner.os == 'Windows' }}
      id: vcpkg
      uses: johnwason/vcpkg-action@04c68c847bf5196ecaa72331ecf51208583916ef # v8
      with:
        pkgs: openssl
        extra-args: --classic --host-triplet=${{inputs.vcpkg-triplet}}
        triplet: ${{inputs.vcpkg-triplet}}
        token: ${{ github.token }}
        # Unpinned on purpose (A-23 (#47)): the action tracks vcpkg master so new
        # ports resolve; our vcpkg.json builtin-baseline still pins library
        # versions. Revisit if a vcpkg-action release ever ships a breaking input.
        revision: master

    - name: Cache Chocolatey
      id: cache-choco
      if: (runner.os == 'Windows')
      uses: actions/cache@v5
      with:
        path: |
            C:/ProgramData/chocolatey/bin/
            C:/ProgramData/chocolatey/lib/doxygen.install
            C:/Program*/doxygen/
        key: cache-chocolatey${{ matrix.target.arch }}-doxygen

    - name: Install doxygen (windows)
      if: ((runner.os == 'Windows') && (steps.cache-choco.outputs.cache-hit != 'true'))
      shell: bash
      run: choco install doxygen.install

    - name: Install Wix
      if: ${{ runner.os == 'Windows' }}
      shell: cmd
      run: |
        dotnet tool install --global wix --version 5.0.2
        wix extension add --global WixToolset.UI.wixext/5.0.2
        wix extension add --global WixToolset.Util.wixext/5.0.2
        wix extension add --global WixToolset.Firewall.wixext/5.0.2


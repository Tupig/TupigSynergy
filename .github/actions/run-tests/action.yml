name: "Run tests"
description: "Runs the unit tests"

inputs:
  exclude-tests:
    description: "Exact CTest regex already executed by the critical-contract step"
    required: false
    default: ""

runs:
  using: "composite"

  steps:
    - name: Unit Tests
      id: unit-tests
      env:
        QT_QPA_PLATFORM: offscreen
        CTEST_EXCLUDE_REGEX: ${{ inputs.exclude-tests }}
      # Relative to the project directory (the repository root).
      working-directory: .
      run: |
        set -euo pipefail
        # Refuse indirect diagnostic paths before cleanup or the no-tests route.
        python3 scripts/ci/check-diagnostic-paths.py --recursive \
          build/src/unittests/test-results build/src/unittests/Testing/Temporary
        if [ ! -d "build/src/unittests" ]; then
          echo "Required native test directory is missing."
          exit 1
        fi
        mkdir -p build/src/unittests/test-results
        # Remove only fixed build outputs so a crash cannot reuse old results.
        rm -f -- build/src/unittests/test-results/*.txt \
          build/src/unittests/Testing/Temporary/LastTest.log \
          build/src/unittests/test-results/ctest.xml
        python3 scripts/ci/check-diagnostic-paths.py \
          build/src/unittests/test-results/ctest.xml build/src/unittests/Testing/Temporary/LastTest.log
        ctest_args=(--test-dir build/src/unittests --build-config Release --output-on-failure --no-tests=error
          --output-junit "$PWD/build/src/unittests/test-results/ctest.xml")
        if [ -n "${CTEST_EXCLUDE_REGEX:-}" ]; then
          ctest_args+=(-E "$CTEST_EXCLUDE_REGEX")
        fi
        ctest "${ctest_args[@]}"
      shell: bash

    - name: Show current test failure diagnostics
      if: ${{ failure() }}
      working-directory: .
      shell: bash
      run: |
        set -euo pipefail
        python3 scripts/ci/check-diagnostic-paths.py --recursive \
          build/src/unittests/test-results build/src/unittests/Testing/Temporary
        found_result=false
        for result in build/src/unittests/test-results/*.txt build/src/unittests/test-results/*.xml; do
          if [ -f "$result" ]; then
            found_result=true
            echo "=== $result ==="
            if [ -s "$result" ]; then
              cat -- "$result"
            else
              echo "Empty current Qt text result: $result"
            fi
          fi
        done
        if [ "$found_result" = false ]; then
          echo "Missing current Qt text results."
        fi
        last_test=build/src/unittests/Testing/Temporary/LastTest.log
        if [ -f "$last_test" ]; then
          echo "=== $last_test ==="
          if [ -s "$last_test" ]; then
            cat -- "$last_test"
          else
            echo "Empty current CTest LastTest.log."
          fi
        else
          echo "Missing current CTest LastTest.log."
        fi

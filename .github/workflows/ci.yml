# PRs validate only Windows x64 and macOS arm64.
# Manual snapshots build the selected native platform(s), without publication.
# Manual releases run at an existing exact version tag on integrated main.
# Both native builds, contract checks and payload audits must pass before publication.
# Release events do not start builds; publication creates a new draft then exposes it.

name: TuPig Synergy

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      package-type:
        description: "release: exact existing version tag on main, Windows and macOS, new GitHub Release. snapshot: no publish; platform applies."
        required: false
        default: "snapshot"
        type: choice
        options:
          - release
          - snapshot
      platform:
        description: "snapshot only. all = all platforms. Ignored when package-type is release."
        required: false
        default: "all"
        type: choice
        options:
          - "all"
          - windows
          - macos
  pull_request:
    branches: [main]

# Automatic PR runs cancel only their own older run. Manual and release runs
# never cancel, and neither can cancel another run's group.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PACKAGE_PREFIX: ${{ vars.SYNERGY_PACKAGE_PREFIX || 'synergy' }}
  CMAKE_CONFIGURE: "cmake -Bbuild -DCMAKE_BUILD_TYPE=Release -DSKIP_BUILD_TESTS=ON -DSYNERGY_ENABLE_INTERACTIVE_TESTS=ON -DCMAKE_COMPILE_WARNING_AS_ERROR=ON"
  # Third-party Node actions (vcpkg) print DeprecationWarning on Node 20. That is not a project defect.
  NODE_OPTIONS: --no-deprecation

  # Release shape, propagated to cmake (Synergy.cmake reads these as options).
  # Explicit package-type=release uses the committed clean X.Y.Z.
  # Manual package-type=snapshot adds the snapshot suffix.
  # Pull requests fall through to the cmake dev default.
  SYNERGY_VERSION_RELEASE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.package-type == 'release' }}
  SYNERGY_VERSION_SNAPSHOT: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.package-type == 'snapshot' }}

jobs:
  # ---------------------------------------------------------------------------
  # 1. Prepare. Every event starts here. The plan step records which
  # platforms this event is allowed to build.
  # ---------------------------------------------------------------------------
  get-version:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      version: ${{ steps.get-version.outputs.version }}
      base: ${{ steps.get-version.outputs.base }}
      patch: ${{ steps.get-version.outputs.patch }}
      windows_targets: ${{ steps.plan.outputs.windows_targets }}
      macos_targets: ${{ steps.plan.outputs.macos_targets }}
      build_windows: ${{ steps.plan.outputs.build_windows }}
      build_macos: ${{ steps.plan.outputs.build_macos }}
      publish_release: ${{ steps.plan.outputs.publish_release }}
      skip_unchanged: ${{ steps.plan.outputs.skip_unchanged }}

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Get version
        id: get-version
        uses: ./.github/actions/get-version

      - name: Check vcpkg version matches Version.cmake
        run: python3 scripts/ci/check-version-consistency.py

      # One place decides what this event builds. Job `if`s only read these
      # outputs, so a platform is not accidentally both required and skipped.
      # Pull requests and releases build both native targets. Snapshots honor platform.
      - name: Plan builds for this event
        id: plan
        env:
          PACKAGE_TYPE: ${{ inputs.package-type }}
          PLATFORM: ${{ inputs.platform }}
          VERSION_BASE: ${{ steps.get-version.outputs.base }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          build_windows=false
          build_macos=false
          publish_release=false
          skip_unchanged=false
          case "$GITHUB_EVENT_NAME" in
            pull_request)
              build_windows=true
              build_macos=true
              ;;
            workflow_dispatch)
              case "$PACKAGE_TYPE" in
                release)
                  build_windows=true
                  build_macos=true
                  publish_release=true
                  ;;
                snapshot)
                  case "$PLATFORM" in
                    ''|all) build_windows=true; build_macos=true ;;
                    windows) build_windows=true ;;
                    macos) build_macos=true ;;
                    *) echo "::error::unsupported snapshot platform"; exit 1 ;;
                  esac
                  ;;
                *) echo "::error::unsupported package type"; exit 1 ;;
              esac
              ;;
            *)
              echo "::error::unexpected event $GITHUB_EVENT_NAME"
              exit 1
              ;;
          esac
          if [ "$build_windows" != true ] && [ "$build_macos" != true ]; then
            echo "::error::empty native build plan"
            exit 1
          fi
          # Builds and distribution are limited to Windows x64 and macOS arm64.
          windows_targets='[{"name":"windows-2022-x64","runs-on":"windows-2022","vcpkg-triplet":"x64-windows-release","arch":"amd64","qt-version":"6.10.3"}]'
          macos_targets='[{"name":"macos-arm64","expected-arch":"arm64","runs-on":"macos-15","timeout":20,"qt-version":"6.11.1","config-args":"-DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0"}]'
          {
            echo "windows_targets=$windows_targets"
            echo "macos_targets=$macos_targets"
            echo "build_windows=$build_windows"
            echo "build_macos=$build_macos"
            echo "publish_release=$publish_release"
            echo "skip_unchanged=$skip_unchanged"
          } >> "$GITHUB_OUTPUT"
          echo "plan event=$GITHUB_EVENT_NAME package=${PACKAGE_TYPE:-<none>} platform=${PLATFORM:-<none>} windows=$build_windows macos=$build_macos publish=$publish_release skip=$skip_unchanged"

  lint-clang:
    needs: get-version
    if: needs.get-version.outputs.skip_unchanged != 'true'
    runs-on: ubuntu-slim
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Clang-format
        uses: ./.github/actions/lint-clang

  # Reads scripts/ci/encoding-check.json. on_violation defaults to fail, so a
  # bad file stops the build jobs. Set it to warn to print and continue.
  lint-encoding:
    needs: [get-version, lint-clang]
    if: needs.get-version.outputs.skip_unchanged != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Check source encoding
        run: python3 scripts/ci/check-encoding.py

      # lupdate only adds new tr() sources as unfinished; without this gate a
      # new dialog would silently ship in English on a Chinese system.
      - name: Check Chinese translations
        run: python3 scripts/ci/check-translations.py

  codeql:
    name: Analyze C++
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: c-cpp
          build-mode: none
      - name: Analyze C++
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:c-cpp

  # ---------------------------------------------------------------------------
  # 2. Build. One CMake configure line per OS; the runner compiler differs.
  # Windows x64: MSVC + Ninja. macOS arm64: AppleClang.
  # ---------------------------------------------------------------------------
  build-windows:
    needs: [get-version, lint-encoding]
    if: ${{ needs.get-version.outputs.build_windows == 'true' }}
    name: windows-2022-x64
    runs-on: windows-2022
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read

    env:
      # SignPath Foundation holds the code-signing key. The API token is the only
      # secret. Organization id and project slug are Actions variables assigned
      # after the project is approved. Missing any of them leaves the package unsigned.
      WINDOWS_SIGNING: ${{ needs.get-version.outputs.publish_release == 'true' && secrets.SIGNPATH_API_TOKEN != '' && vars.SIGNPATH_ORGANIZATION_ID != '' && vars.SIGNPATH_PROJECT_SLUG != '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          fetch-tags: true

      # Stage: toolchain. vcvars via setup-msvc-dev; Qt from the CI Qt build, OpenSSL from vcpkg.
      - name: Setup VC++ environment
        uses: TheMrMilchmann/setup-msvc-dev@368ef7d1ee4d1171b31d4a7f67f4d954f903f5a9 # v4.1.0
        with:
          arch: amd64
          spectre: true

      - name: Install dependencies
        id: get-deps
        uses: ./.github/actions/install-dependencies
        with:
          qt-version: 6.10.3
          vcpkg-triplet: x64-windows-release

      # Stage: compile. GUI must be synergy_<X.Y.Z>.exe; core and daemon stay unversioned.
      - name: Configure
        run: ${{ env.CMAKE_CONFIGURE }} -G Ninja ${{ steps.get-deps.outputs.vcpkg-cmake-config }} -DSYNERGY_VERSION_RELEASE=${{ env.SYNERGY_VERSION_RELEASE }} -DSYNERGY_VERSION_SNAPSHOT=${{ env.SYNERGY_VERSION_SNAPSHOT }} -DSYNERGY_CI_QT_NOTICES="${{ steps.get-deps.outputs.qt-notice-root }}" -DSYNERGY_CI_QT_NOTICES_SHA256="${{ steps.get-deps.outputs.qt-notice-sha256 }}"

      - name: Build
        shell: bash
        run: cmake --build build --config Release -j8

      - name: Use Windows host fonts for offscreen tests
        shell: cmd
        run: |
          @echo off
          if not defined SystemRoot exit /b 1
          if not exist "%SystemRoot%\Fonts\" exit /b 1
          dir /b /a-d "%SystemRoot%\Fonts\*.ttf" >nul 2>&1
          if errorlevel 1 exit /b 1
          echo QT_QPA_FONTDIR=%SystemRoot%\Fonts>>"%GITHUB_ENV%"

      - name: GUI configuration and critical contract tests
        timeout-minutes: 15
        env:
          QT_QPA_PLATFORM: windows
          QT_STYLE_OVERRIDE: fusion
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci/check-diagnostic-paths.py build/CMakeCache.txt \
            build/r3-test-evidence build/src/unittests/test-results \
            build/src/unittests/Testing/Temporary/LastTest.log
          cache=build/CMakeCache.txt
          test -f "$cache" || { echo 'Missing configured CMake cache'; exit 1; }
          value() { sed -n "s/^$1:[^=]*=//p" "$cache"; }
          test "$(value BUILD_TESTS)" = ON || { echo 'Required native tests are disabled'; exit 1; }
          qt_dir=$(value QT_DIR)
          test -f "$qt_dir/Qt6Config.cmake" && test ! -f "$qt_dir/Qt5Config.cmake" || {
            echo 'Required unambiguous Qt6 configuration is unavailable'; exit 1;
          }
          mkdir -p build/r3-test-evidence
          suites=(PageHostTests EditorTransactionTests NativeDesignTests LayoutAcceptanceTests
            R3RuntimeContextTests R3OptionContractTests R3SerializationTests R3MotionContractTests
            R3StartupContractTests R3VisualContractTests R3TrayQuitTests
            R4VisualContractTests MainWindowFlowTests DialogRenderTests)
          for suite in "${suites[@]}"; do
            target=$suite
            if [ "$suite" = R4VisualContractTests ]; then target=R4VisualProbe; fi
            python3 scripts/ci/check-diagnostic-paths.py "build/r3-test-evidence/${suite}-build.log"
            cmake --build build --config Release --target "$target" -j8 2>&1 | tee "build/r3-test-evidence/${suite}-build.log"
            python3 scripts/ci/check-diagnostic-paths.py --recursive \
              build/src/unittests/Testing/Temporary "build/src/unittests/test-results/${suite}.txt" \
              "build/r3-test-evidence/${suite}.xml" "build/r3-test-evidence/${suite}.log"
            if [ "$suite" = MainWindowFlowTests ]; then
              python3 scripts/ci/check-diagnostic-paths.py --recursive build/r3-test-evidence/main-window-images
              export SYNERGY_UI_EVIDENCE_DIR="$(python3 -c 'from pathlib import Path; print(Path("build/r3-test-evidence/main-window-images").resolve().as_posix())')"
            fi
            status=0
            ctest --test-dir build/src/unittests --build-config Release --output-on-failure --no-tests=error \
              --output-junit "$PWD/build/r3-test-evidence/${suite}.xml" \
              --output-log "$PWD/build/r3-test-evidence/${suite}.log" -R "^${suite}$" || status=$?
            if [ "$suite" = MainWindowFlowTests ]; then unset SYNERGY_UI_EVIDENCE_DIR; fi
            python3 scripts/ci/check-diagnostic-paths.py \
              "build/src/unittests/test-results/${suite}.txt" build/src/unittests/Testing/Temporary/LastTest.log \
              "build/r3-test-evidence/${suite}-${suite}.txt" "build/r3-test-evidence/${suite}-LastTest.log"
            for raw in "build/src/unittests/test-results/${suite}.txt" \
              build/src/unittests/Testing/Temporary/LastTest.log; do
              if [ -f "$raw" ]; then cp "$raw" "build/r3-test-evidence/${suite}-$(basename "$raw")"; fi
            done
            test "$status" -eq 0 || exit "$status"
          done

      # Iron rule: the GUI file is synergy_<X.Y.Z>.exe. X.Y.Z is get-version's
      # base, which SaveVersion.cmake reads from Version.cmake. core and daemon
      # stay unversioned so the GUI can still launch them.
      - name: Require synergy_<version>.exe
        id: gui-exe
        shell: bash
        run: |
          set -euo pipefail
          base="${{ needs.get-version.outputs.base }}"
          ver="${{ needs.get-version.outputs.version }}"
          # Release builds must land exactly on the base version; snapshot and
          # dev builds carry a suffix (X.Y.Z[-STAGE]-snapshot+rN) and only have
          # to stay derived from it, which also matches the GUI exe name rule.
          if [ "${{ env.SYNERGY_VERSION_RELEASE }}" = "true" ] && [ "$ver" != "$base" ]; then
            echo "::error::release version must be ${base}, got ${ver}"
            exit 1
          fi
          if [ "${{ env.SYNERGY_VERSION_RELEASE }}" != "true" ] && [[ "$ver" != "$base"* ]]; then
            echo "::error::version ${ver} does not start with base ${base}"
            exit 1
          fi
          count=$(find build/bin -type f -name "synergy_${base}.exe" | wc -l)
          if [ "$count" -ne 1 ]; then
            echo "::error::expected exactly one synergy_${base}.exe, found ${count}"
            find build/bin -type f -name '*.exe' || true
            exit 1
          fi
          exe=$(find build/bin -type f -name "synergy_${base}.exe")
          dir=$(dirname "$exe")
          test -f "$dir/synergy-core.exe"
          test -f "$dir/synergy-daemon.exe"
          echo "path=$exe" >> "$GITHUB_OUTPUT"
          echo "GUI exe: $exe"

      # Stage: sign executables before WiX embeds them. Skipped until the
      # SignPath Foundation project is approved and the Actions secret and
      # variables exist. The package is still produced, unsigned.
      - name: Windows signing not configured
        if: env.SYNERGY_VERSION_RELEASE == 'true' && env.WINDOWS_SIGNING != 'true'
        shell: bash
        run: echo "Windows code signing skipped. Apply at https://signpath.org/ and set SIGNPATH_API_TOKEN plus SIGNPATH_ORGANIZATION_ID and SIGNPATH_PROJECT_SLUG. Artifacts from this run are unsigned."

      - name: Stage binaries for signing
        if: env.SYNERGY_VERSION_RELEASE == 'true' && env.WINDOWS_SIGNING == 'true'
        shell: cmd
        run: scripts\ci\ci-windows-signing.bat stage

      - name: Upload unsigned executables
        if: env.SYNERGY_VERSION_RELEASE == 'true' && env.WINDOWS_SIGNING == 'true'
        id: upload-unsigned-exes
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: unsigned-signpath-exes-windows-2022-x64
          path: ${{ runner.temp }}\sign-stage\in\*.exe
          retention-days: 1
          if-no-files-found: error

      - name: Sign executables with SignPath Foundation
        if: env.SYNERGY_VERSION_RELEASE == 'true' && env.WINDOWS_SIGNING == 'true'
        id: sign-exes
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG || 'release-signing' }}
          artifact-configuration-slug: windows-executables
          github-artifact-id: ${{ steps.upload-unsigned-exes.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 1200
          output-artifact-directory: ${{ runner.temp }}\sign-stage\out

      - name: Restore + verify signed binaries
        if: env.SYNERGY_VERSION_RELEASE == 'true' && env.WINDOWS_SIGNING == 'true'
        shell: cmd
        run: scripts\ci\ci-windows-signing.bat restore

      - name: Upload synergy_<version>.exe
        if: ${{ needs.get-version.outputs.publish_release == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: synergy_${{ needs.get-version.outputs.base }}.exe
          path: ${{ steps.gui-exe.outputs.path }}
          if-no-files-found: error

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          if cmake --build build --config Release -j8 --target package; then
            exit 0
          fi
          # CPack 默认只打印日志路径；失败时保留真正的 WiX 诊断。
          while IFS= read -r -d '' logfile; do
            printf '\n--- %s ---\n' "$logfile"
            cat "$logfile"
          done < <(find build/_CPack_Packages -type f -name '*.log' -print0)
          exit 1

      - name: Upload package failure diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: windows-x64-package-diagnostics
          path: |
            build/_CPack_Packages/**/*.log
            build/_CPack_Packages/**/*.wxs
            build/_CPack_Packages/**/*.wxl
          if-no-files-found: ignore
          retention-days: 7

      - name: Locate MSI
        if: env.SYNERGY_VERSION_RELEASE == 'true' && env.WINDOWS_SIGNING == 'true'
        id: locate-msi
        shell: cmd
        run: scripts\ci\ci-windows-signing.bat locate-msi

      - name: Upload unsigned MSI
        if: env.SYNERGY_VERSION_RELEASE == 'true' && env.WINDOWS_SIGNING == 'true'
        id: upload-unsigned-msi
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: unsigned-signpath-msi-windows-2022-x64
          path: ${{ steps.locate-msi.outputs.path }}
          archive: false
          retention-days: 1
          if-no-files-found: error

      - name: Sign MSI with SignPath Foundation
        if: env.SYNERGY_VERSION_RELEASE == 'true' && env.WINDOWS_SIGNING == 'true'
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG || 'release-signing' }}
          artifact-configuration-slug: windows-msi
          github-artifact-id: ${{ steps.upload-unsigned-msi.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 1200
          output-artifact-directory: ${{ runner.temp }}\sign-stage\msi
          skip-decompress: true

      - name: Replace MSI with the signed file
        if: env.SYNERGY_VERSION_RELEASE == 'true' && env.WINDOWS_SIGNING == 'true'
        shell: cmd
        env:
          MSI_PATH: ${{ steps.locate-msi.outputs.path }}
          SIGNED_MSI_DIR: ${{ runner.temp }}\sign-stage\msi
        run: scripts\ci\ci-windows-signing.bat replace-msi

      - name: Verify MSI is signed
        if: env.SYNERGY_VERSION_RELEASE == 'true' && env.WINDOWS_SIGNING == 'true'
        shell: cmd
        env:
          MSI_PATH: ${{ steps.locate-msi.outputs.path }}
        run: scripts\ci\ci-windows-signing.bat verify-msi

      # Stage: test the build and the package, then upload it.
      - name: Unit tests
        uses: ./.github/actions/run-tests
        timeout-minutes: 15
        with:
          exclude-tests: '^(PageHostTests|EditorTransactionTests|NativeDesignTests|LayoutAcceptanceTests|R3RuntimeContextTests|R3OptionContractTests|R3SerializationTests|R3MotionContractTests|R3StartupContractTests|R3VisualContractTests|R3TrayQuitTests|R4VisualContractTests|MainWindowFlowTests|DialogRenderTests)$'

      - name: Test packaged build
        uses: ./.github/actions/test-package
        with:
          expected-arch: x64

      - name: Upload package
        # 每次构建都上传产物，便于直接下载 GitHub 构建版本做验收。
        if: ${{ success() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: package-${{ env.PACKAGE_PREFIX }}-${{ needs.get-version.outputs.version }}-windows-2022-x64
          path: ${{ github.workspace }}/build/${{ env.PACKAGE_PREFIX }}[-_]*.*
          retention-days: 14

      - name: Preserve test probe identities
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci/check-diagnostic-paths.py \
            build/bin/R3StartupProbe.exe build/bin/R4VisualProbe.exe \
            build/bin/R3StartupProbe.app/Contents/MacOS/R3StartupProbe \
            build/bin/R4VisualProbe.app/Contents/MacOS/R4VisualProbe \
            build/r3-test-evidence/R3StartupProbe-identity.json \
            build/r3-test-evidence/R4VisualProbe-identity.json
          mkdir -p build/r3-test-evidence
          python3 - <<'PYTHON'
          import hashlib, json
          from pathlib import Path
          candidates = (
              Path('build/bin/R3StartupProbe.exe'), Path('build/bin/R4VisualProbe.exe'),
              Path('build/bin/R3StartupProbe.app/Contents/MacOS/R3StartupProbe'),
              Path('build/bin/R4VisualProbe.app/Contents/MacOS/R4VisualProbe'),
          )
          records = [{'path': str(path), 'sha256': hashlib.sha256(path.read_bytes()).hexdigest()}
                     for path in candidates if path.is_file()]
          for probe in ('R3StartupProbe', 'R4VisualProbe'):
              output = Path('build/r3-test-evidence/' + probe + '-identity.json')
              selected = [record for record in records if Path(record['path']).name in (probe, probe + '.exe')]
              output.write_text(json.dumps({'probe': probe, 'files': selected}, indent=2) + '\n')
          PYTHON

      - name: Validate diagnostic upload paths
        id: diagnostics-safe
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci/check-diagnostic-paths.py --recursive \
            build/r3-test-evidence/ \
            build/r3-test-evidence/R3StartupProbe-identity.json \
            build/r3-test-evidence/R4VisualProbe-identity.json \
            build/src/unittests/test-results/ \
            build/src/unittests/test-results/ctest.xml \
            build/src/unittests/Testing/Temporary/LastTest.log
          echo 'safe=true' >> "$GITHUB_OUTPUT"

      - name: Upload raw contract diagnostics
        if: ${{ always() && steps.diagnostics-safe.outputs.safe == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: r3-test-evidence-windows-x64
          path: |
            build/r3-test-evidence/
            build/r3-test-evidence/R3StartupProbe-identity.json
            build/r3-test-evidence/R4VisualProbe-identity.json
            build/src/unittests/test-results/
            build/src/unittests/test-results/ctest.xml
            build/src/unittests/Testing/Temporary/LastTest.log
          if-no-files-found: ignore
          retention-days: 14

  build-macos:
    needs: [get-version, lint-encoding]
    if: ${{ needs.get-version.outputs.build_macos == 'true' }}
    name: macos-arm64
    runs-on: macos-15
    timeout-minutes: 60

    env:
      MAC_SIGNING: ${{ needs.get-version.outputs.publish_release == 'true' && secrets.APPLE_CODESIGN_ID != '' }}
      MAC_CODESIGN_ID: ${{ needs.get-version.outputs.publish_release == 'true' && secrets.APPLE_CODESIGN_ID || '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          fetch-tags: true

      # Stage: toolchain, then compile. Qt comes from the CI Qt build.
      - name: Install dependencies
        id: get-deps
        uses: ./.github/actions/install-dependencies
        with:
          qt-version: 6.11.1

      - name: Configure
        shell: bash
        run: |
          set -euo pipefail
          openssl_root=$(brew --prefix openssl@3)
          ${{ env.CMAKE_CONFIGURE }} -DCMAKE_OSX_ARCHITECTURES="arm64" -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0 -DSYNERGY_VERSION_RELEASE=${{ env.SYNERGY_VERSION_RELEASE }} -DSYNERGY_VERSION_SNAPSHOT=${{ env.SYNERGY_VERSION_SNAPSHOT }} -DAPPLE_CODESIGN_ID="${{ needs.get-version.outputs.publish_release == 'true' && secrets.APPLE_CODESIGN_ID || '' }}" -DOPENSSL_ROOT_DIR="$openssl_root" -DSYNERGY_CI_QT_NOTICES="${{ steps.get-deps.outputs.qt-notice-root }}" -DSYNERGY_CI_QT_NOTICES_SHA256="${{ steps.get-deps.outputs.qt-notice-sha256 }}"

      - name: Build
        shell: bash
        run: cmake --build build --config Release -j8

      - name: GUI configuration and critical contract tests
        timeout-minutes: 15
        env:
          QT_QPA_PLATFORM: cocoa
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci/check-diagnostic-paths.py build/CMakeCache.txt \
            build/r3-test-evidence build/src/unittests/test-results \
            build/src/unittests/Testing/Temporary/LastTest.log
          cache=build/CMakeCache.txt
          test -f "$cache" || { echo 'Missing configured CMake cache'; exit 1; }
          value() { sed -n "s/^$1:[^=]*=//p" "$cache"; }
          test "$(value BUILD_TESTS)" = ON || { echo 'Required native tests are disabled'; exit 1; }
          qt_dir=$(value QT_DIR)
          test -f "$qt_dir/Qt6Config.cmake" && test ! -f "$qt_dir/Qt5Config.cmake" || {
            echo 'Required unambiguous Qt6 configuration is unavailable'; exit 1;
          }
          mkdir -p build/r3-test-evidence
          suites=(PageHostTests EditorTransactionTests NativeDesignTests LayoutAcceptanceTests
            R3RuntimeContextTests R3OptionContractTests R3SerializationTests R3MotionContractTests
            R3StartupContractTests R3VisualContractTests R3TrayQuitTests
            R4VisualContractTests MainWindowFlowTests DialogRenderTests)
          for suite in "${suites[@]}"; do
            target=$suite
            if [ "$suite" = R4VisualContractTests ]; then target=R4VisualProbe; fi
            python3 scripts/ci/check-diagnostic-paths.py "build/r3-test-evidence/${suite}-build.log"
            cmake --build build --config Release --target "$target" -j8 2>&1 | tee "build/r3-test-evidence/${suite}-build.log"
            python3 scripts/ci/check-diagnostic-paths.py --recursive \
              build/src/unittests/Testing/Temporary "build/src/unittests/test-results/${suite}.txt" \
              "build/r3-test-evidence/${suite}.xml" "build/r3-test-evidence/${suite}.log"
            if [ "$suite" = MainWindowFlowTests ]; then
              python3 scripts/ci/check-diagnostic-paths.py --recursive build/r3-test-evidence/main-window-images
              export SYNERGY_UI_EVIDENCE_DIR="$PWD/build/r3-test-evidence/main-window-images"
            fi
            status=0
            ctest --test-dir build/src/unittests --build-config Release --output-on-failure --no-tests=error \
              --output-junit "$PWD/build/r3-test-evidence/${suite}.xml" \
              --output-log "$PWD/build/r3-test-evidence/${suite}.log" -R "^${suite}$" || status=$?
            if [ "$suite" = MainWindowFlowTests ]; then unset SYNERGY_UI_EVIDENCE_DIR; fi
            python3 scripts/ci/check-diagnostic-paths.py \
              "build/src/unittests/test-results/${suite}.txt" build/src/unittests/Testing/Temporary/LastTest.log \
              "build/r3-test-evidence/${suite}-${suite}.txt" "build/r3-test-evidence/${suite}-LastTest.log"
            for raw in "build/src/unittests/test-results/${suite}.txt" \
              build/src/unittests/Testing/Temporary/LastTest.log; do
              if [ -f "$raw" ]; then cp "$raw" "build/r3-test-evidence/${suite}-$(basename "$raw")"; fi
            done
            test "$status" -eq 0 || exit "$status"
          done

      # Stage: sign and notarize, only when APPLE_CODESIGN_ID is set.
      # Create an ephemeral keychain just for this run and import the Developer
      # ID Application certificate from the base64-encoded P12 in secrets. Using
      # a per-run keychain (rather than System.keychain) keeps the cert out of
      # any shared state on the runner; the keychain is destroyed at job end.
      # set-key-partition-list grants codesign passwordless access so the later
      # sign step doesn't prompt.
      - name: Set up signing keychain
        if: env.MAC_SIGNING == 'true'
        shell: bash
        env:
          APPLE_P12_CERTIFICATE: ${{ secrets.APPLE_P12_CERTIFICATE }}
          APPLE_P12_PASSWORD: ${{ secrets.APPLE_P12_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/sign.keychain-db"
          keychain_pass=$(openssl rand -base64 32)
          security create-keychain -p "$keychain_pass" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$keychain_pass" "$keychain"
          keychains=()
          while IFS= read -r existing; do
            keychains+=("$existing")
          done < <(security list-keychains -d user | sed 's/^[[:space:]]*"//; s/"[[:space:]]*$//')
          security list-keychains -d user -s "$keychain" "${keychains[@]}"
          cert_file="$RUNNER_TEMP/cert.p12"
          echo "$APPLE_P12_CERTIFICATE" | base64 --decode > "$cert_file"
          security import "$cert_file" -k "$keychain" -P "$APPLE_P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_pass" "$keychain"
          rm -f "$cert_file"
          echo "SIGN_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
          echo "SIGN_KEYCHAIN_PASS=$keychain_pass" >> "$GITHUB_ENV"

      # CPack runs macdeployqt and, when a Developer ID is configured, codesigns
      # the bundle that gets embedded in the DMG (see deploy/mac/deploy.cmake), so
      # the keychain must be unlocked first. CPack on macOS is flaky; retry a
      # handful of times before failing.
      - name: Package
        shell: bash
        run: |
          if [ -n "$SIGN_KEYCHAIN" ]; then
            security unlock-keychain -p "$SIGN_KEYCHAIN_PASS" "$SIGN_KEYCHAIN"
          fi
          for i in $(seq 1 5); do
            if cmake --build build --config Release -j8 --target package 2>&1; then
              echo "Package successful"
              exit 0
            fi
            echo "Package attempt $i failed"
            sleep 1
          done
          echo "ERROR: package failed after 5 attempts" >&2
          exit 1

      # Sign the DMG itself so Gatekeeper trusts it before extraction. Then
      # submit to notarytool (synchronous via --wait) and staple the returned
      # ticket so Gatekeeper can verify offline.
      - name: Sign + notarize + staple DMG
        if: env.MAC_SIGNING == 'true'
        shell: bash
        env:
          APPLE_CODESIGN_ID: ${{ secrets.APPLE_CODESIGN_ID }}
          APPLE_NOTARY_USER: ${{ secrets.APPLE_NOTARY_USER }}
          APPLE_NOTARY_PASSWORD: ${{ secrets.APPLE_NOTARY_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          dmg=$(find build -maxdepth 2 -name "*.dmg" -type f | head -n1)
          if [ -z "$dmg" ]; then
            echo "ERROR: no DMG found under build/" >&2
            find build -maxdepth 2 -name "*.dmg" 2>/dev/null
            exit 1
          fi
          echo "Found DMG: $dmg"

          security unlock-keychain -p "$SIGN_KEYCHAIN_PASS" "$SIGN_KEYCHAIN"
          /usr/bin/codesign --force --timestamp --sign "$APPLE_CODESIGN_ID" "$dmg"

          result=$(xcrun notarytool submit "$dmg" \
            --apple-id "$APPLE_NOTARY_USER" \
            --password "$APPLE_NOTARY_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --output-format json --wait)
          echo "$result"
          id=$(echo "$result" | python3 -c "import sys, json; print(json.load(sys.stdin)['id'])")
          status=$(echo "$result" | python3 -c "import sys, json; print(json.load(sys.stdin)['status'])")
          if [ "$status" != "Accepted" ]; then
            echo "Notarization $status; per-file detail follows:" >&2
            xcrun notarytool log "$id" \
              --apple-id "$APPLE_NOTARY_USER" \
              --password "$APPLE_NOTARY_PASSWORD" \
              --team-id "$APPLE_TEAM_ID"
            exit 1
          fi

          xcrun stapler staple "$dmg"
          xcrun stapler validate "$dmg"
          spctl -a -t open --context context:primary-signature -v "$dmg"
          echo "DMG signed + notarized + stapled: $dmg"

      # Stage: test the build and the package, then upload it.
      - name: Unit tests
        uses: ./.github/actions/run-tests
        timeout-minutes: 15
        with:
          exclude-tests: '^(PageHostTests|EditorTransactionTests|NativeDesignTests|LayoutAcceptanceTests|R3RuntimeContextTests|R3OptionContractTests|R3SerializationTests|R3MotionContractTests|R3StartupContractTests|R3VisualContractTests|R3TrayQuitTests|R4VisualContractTests|MainWindowFlowTests|DialogRenderTests)$'

      - name: Test packaged build
        uses: ./.github/actions/test-package
        with:
          expected-arch: arm64

      - name: Upload package
        # 每次构建都上传产物，便于直接下载 GitHub 构建版本做验收。
        if: ${{ success() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: package-${{ env.PACKAGE_PREFIX }}-${{ needs.get-version.outputs.version }}-macos-arm64
          path: ${{ github.workspace }}/build/${{ env.PACKAGE_PREFIX }}[-_]*.*
          retention-days: 14

      - name: Preserve test probe identities
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci/check-diagnostic-paths.py \
            build/bin/R3StartupProbe.exe build/bin/R4VisualProbe.exe \
            build/bin/R3StartupProbe.app/Contents/MacOS/R3StartupProbe \
            build/bin/R4VisualProbe.app/Contents/MacOS/R4VisualProbe \
            build/r3-test-evidence/R3StartupProbe-identity.json \
            build/r3-test-evidence/R4VisualProbe-identity.json
          mkdir -p build/r3-test-evidence
          python3 - <<'PYTHON'
          import hashlib, json
          from pathlib import Path
          candidates = (
              Path('build/bin/R3StartupProbe.exe'), Path('build/bin/R4VisualProbe.exe'),
              Path('build/bin/R3StartupProbe.app/Contents/MacOS/R3StartupProbe'),
              Path('build/bin/R4VisualProbe.app/Contents/MacOS/R4VisualProbe'),
          )
          records = [{'path': str(path), 'sha256': hashlib.sha256(path.read_bytes()).hexdigest()}
                     for path in candidates if path.is_file()]
          for probe in ('R3StartupProbe', 'R4VisualProbe'):
              output = Path('build/r3-test-evidence/' + probe + '-identity.json')
              selected = [record for record in records if Path(record['path']).name in (probe, probe + '.exe')]
              output.write_text(json.dumps({'probe': probe, 'files': selected}, indent=2) + '\n')
          PYTHON

      - name: Validate diagnostic upload paths
        id: diagnostics-safe
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci/check-diagnostic-paths.py --recursive \
            build/r3-test-evidence/ \
            build/r3-test-evidence/R3StartupProbe-identity.json \
            build/r3-test-evidence/R4VisualProbe-identity.json \
            build/src/unittests/test-results/ \
            build/src/unittests/test-results/ctest.xml \
            build/src/unittests/Testing/Temporary/LastTest.log
          echo 'safe=true' >> "$GITHUB_OUTPUT"

      - name: Upload raw contract diagnostics
        if: ${{ always() && steps.diagnostics-safe.outputs.safe == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: r3-test-evidence-macos-arm64
          path: |
            build/r3-test-evidence/
            build/r3-test-evidence/R3StartupProbe-identity.json
            build/r3-test-evidence/R4VisualProbe-identity.json
            build/src/unittests/test-results/
            build/src/unittests/test-results/ctest.xml
            build/src/unittests/Testing/Temporary/LastTest.log
          if-no-files-found: ignore
          retention-days: 14

  github-release:
    needs: [get-version, build-windows, build-macos, codeql]
    if: ${{ always() && needs.get-version.result == 'success' && needs.get-version.outputs.publish_release == 'true' && needs.build-windows.result == 'success' && needs.build-macos.result == 'success' && needs.codeql.result == 'success' }}
    runs-on: ubuntu-latest
    # contents:write uploads the Release. id-token and attestations mint the
    # Sigstore provenance for those same bytes. Job permissions replace the
    # workflow default, so contents:write has to stay on this list.
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Download packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: package-*
          path: dist
          merge-multiple: true

      - name: Hash release packages
        id: subjects
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(find dist -type f ! -name '*.digest' | sort)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::no package files to attest"
            exit 1
          fi
          sha256sum "${files[@]}" > "$RUNNER_TEMP/release-subjects.txt"
          echo "path=$RUNNER_TEMP/release-subjects.txt" >> "$GITHUB_OUTPUT"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: ${{ steps.subjects.outputs.path }}

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          # This job does not check out the repo. Without GH_REPO, gh tries
          # to run git and fails with "not a git repository".
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.get-version.outputs.base }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" != workflow_dispatch ] ||
             [ "$GITHUB_REF" != "refs/tags/v${VERSION}" ]; then
            echo "::error::release requires manual dispatch at the exact committed version tag"
            exit 1
          fi
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ && "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::invalid release identity"
            exit 1
          fi
          files=()
          while IFS= read -r file; do
            files+=("$file")
          done < <(find dist -type f ! -name '*.digest' | sort)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::no package files to publish"
            exit 1
          fi
          printf 'Publishing %s files to v%s\n' "${#files[@]}" "$VERSION"
          printf ' - %s\n' "${files[@]}"
          tag="v${VERSION}"
          title="TuPig Synergy ${VERSION}"
          # Every release must carry user-visible update notes. The body starts
          # with GitHub's generated notes (merged pull requests since the
          # previous release), then this footer documents provenance and
          # signing. Keep both bilingual: the project is Chinese-first.
          notes="## 发布信息 / Release information"$'\n\n'
          notes+="- 每个安装包都附带 GitHub 构建来源证明 / Every package carries a GitHub build-provenance attestation:"$'\n'
          notes+="  \`gh attestation verify FILE --repo ${GH_REPO}\`"$'\n'
          notes+="- Windows 包在 SignPath 审批前未签名 / Windows packages are unsigned until SignPath approval."$'\n'
          notes+="- macOS 包未使用 Developer ID 签名与公证，首次运行需在「系统设置 → 隐私与安全性 → 辅助功能」中授权；升级后如再次提示，请重新授权 / "
          notes+="macOS packages use an ad-hoc signature (no Developer ID, no notarization); grant Accessibility permission after the first launch and re-grant after an update if prompted."$'\n'
          marker="Built-From: ${GITHUB_SHA}"
          # The validated integrated commit must already own this version tag.
          # Never let release creation infer a target from the default branch.
          if ! existing_sha=$(gh api "repos/${GH_REPO}/commits/${tag}" --jq .sha 2>/dev/null); then
            echo "::error::Release ${tag} requires an existing validated source tag"
            exit 1
          fi
          if [ "$existing_sha" != "$GITHUB_SHA" ]; then
            echo "::error::Release ${tag} already points to ${existing_sha}; bump the version before publishing"
            exit 1
          fi
          if ! main_sha=$(gh api "repos/${GH_REPO}/commits/main" --jq .sha); then
            echo "::error::cannot resolve integrated main"
            exit 1
          fi
          if [ "$main_sha" != "$GITHUB_SHA" ]; then
            echo "::error::release source is not the current integrated main commit"
            exit 1
          fi
          # Any existing release (including a draft) is immutable to this run.
          # A nonzero query is absence only when the actual HTTP status is 404.
          if release_response=$(gh api --include "repos/${GH_REPO}/releases/tags/${tag}"); then
            echo "::error::Release ${tag} already exists; no assets will be replaced"
            exit 1
          else
            release_status=$(printf '%s\n' "$release_response" | tr -d '\r' | sed -n 's/^HTTP\/[^ ]* \([0-9][0-9][0-9]\)\( .*\)\{0,1\}$/\1/p' | tail -n 1)
            if [ "$release_status" != 404 ]; then
              echo "::error::cannot establish absence of Release ${tag} (HTTP ${release_status:-unknown})"
              exit 1
            fi
          fi
          # All packages are uploaded while private; expose the complete set only last.
          gh release create "$tag" "${files[@]}" --verify-tag --target "$GITHUB_SHA" --title "$title" --generate-notes --draft
          generated=$(gh release view "$tag" --json body -q .body)
          notes_file=$(mktemp)
          trap 'rm -f "$notes_file"' EXIT
          printf '%s\n\n%s\n\n%s\n' "$generated" "$notes" "$marker" > "$notes_file"
          gh release edit "$tag" --notes-file "$notes_file" --draft=false --latest

  ci-passed:
    runs-on: ubuntu-latest
    needs:
      [
        get-version,
        lint-clang,
        lint-encoding,
        codeql,
        build-windows,
        build-macos,
        github-release,
      ]
    if: always()

    steps:
      # Reconstruct the selected route; a skipped required job is always a failure.
      - name: Check all jobs passed or were intentionally skipped
        env:
          PACKAGE_TYPE: ${{ inputs.package-type }}
          PLATFORM: ${{ inputs.platform }}
        run: |
          set -euo pipefail
          expected_windows=false
          expected_macos=false
          expected_release=false
          case "$GITHUB_EVENT_NAME" in
            pull_request)
              expected_windows=true
              expected_macos=true
              ;;
            workflow_dispatch)
              case "$PACKAGE_TYPE" in
                release)
                  expected_windows=true
                  expected_macos=true
                  expected_release=true
                  ;;
                snapshot)
                  case "$PLATFORM" in
                    ''|all) expected_windows=true; expected_macos=true ;;
                    windows) expected_windows=true ;;
                    macos) expected_macos=true ;;
                    *) echo 'Unsupported snapshot platform'; exit 1 ;;
                  esac
                  ;;
                *) echo 'Unsupported package type'; exit 1 ;;
              esac
              ;;
            *) echo 'Unsupported workflow event'; exit 1 ;;
          esac
          test "${{ needs.get-version.outputs.build_windows }}" = "$expected_windows" || exit 1
          test "${{ needs.get-version.outputs.build_macos }}" = "$expected_macos" || exit 1
          test "${{ needs.get-version.outputs.publish_release }}" = "$expected_release" || exit 1
          test "${{ needs.get-version.result }}" = success || exit 1
          test "${{ needs.lint-clang.result }}" = success || exit 1
          test "${{ needs.lint-encoding.result }}" = success || exit 1
          test "${{ needs.codeql.result }}" = success || exit 1
          require_result() {
            local selected="$1" result="$2" expected=skipped
            if [ "$selected" = true ]; then expected=success; fi
            test "$result" = "$expected"
          }
          require_result "$expected_windows" "${{ needs.build-windows.result }}" || exit 1
          require_result "$expected_macos" "${{ needs.build-macos.result }}" || exit 1
          require_result "$expected_release" "${{ needs.github-release.result }}" || exit 1
          printf '\342\234\205 CI passed\n' > "$GITHUB_STEP_SUMMARY"

# Single workflow, shown as "TuPig Synergy" (CMAKE_PROJECT_PROPER_NAME).
# Jobs are ordered for reading; `needs` is what actually schedules them:
#   1. prepare (version, encoding, clang-format, and the trigger plan below)
#   2. build (Windows MSVC, macOS AppleClang arm64+x86_64, Linux gcc, Flatpak)
#   3. publish (GitHub Release, optional S3, Slack on failure)
#   4. analysis (only workflow_dispatch with analyze=true)
#   5. ci-passed, the branch-protection gate
#
# Triggers - one run does not start another:
#   pull_request to main  lint, then Windows, macOS, and the free Linux subset.
#                         Unsigned snapshot artifacts. No publish or notifications.
#                         A newer push to that PR cancels the older run.
#   release published     Windows and macOS, clean version, attach packages. This fires
#                         when a person publishes a Release. The publish job uses the
#                         workflow token, and that token does not start a new workflow,
#                         so it does not loop. Do not publish the same commit from the
#                         UI and from workflow_dispatch; those are different refs and
#                         both would build.
#   workflow_dispatch     manual. package-type=release builds Windows and macOS and
#                         publishes. package-type=snapshot honors platform and does
#                         not publish. analyze is independent of package-type.
# Merging a PR does not start another validation run: the PR run already covered
# the change. PR and manual runs use different concurrency groups, so a free Linux
# check cannot cancel a release build that is already going.

name: TuPig Synergy

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      package-type:
        description: "release: all platforms, clean version, publish the GitHub Release. snapshot: no publish; platform applies."
        required: false
        default: "snapshot"
        type: choice
        options:
          - release
          - snapshot
      platform:
        description: "snapshot only. all = all platforms. Ignored when package-type is release."
        required: false
        default: "all"
        type: choice
        options:
          - "all"
          - windows
          - macos
          - linux
          - flatpak
      analyze:
        description: "Also run clang-tidy, cppcheck, CodeQL, SonarCloud and Valgrind. Does not change which platforms build."
        required: false
        default: false
        type: boolean
      aws-s3-uri:
        description: "Optional S3 override for a manual or release run. Unused when AWS secrets are unset."
        required: false
        type: string
  pull_request:
    branches: [main]
  release:
    types: [published]

# Automatic PR runs cancel only their own older run. Manual and release runs
# never cancel, and neither can cancel another run's group.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PACKAGE_PREFIX: ${{ vars.SYNERGY_PACKAGE_PREFIX || 'synergy' }}
  CMAKE_CONFIGURE: "cmake -Bbuild -DCMAKE_BUILD_TYPE=Release -DSKIP_BUILD_TESTS=ON -DSYNERGY_ENABLE_INTERACTIVE_TESTS=ON -DCMAKE_COMPILE_WARNING_AS_ERROR=ON"
  # Third-party Node actions (vcpkg) print DeprecationWarning on Node 20. That is not a project defect.
  NODE_OPTIONS: --no-deprecation

  # Release shape, propagated to cmake (Synergy.cmake reads these as options).
  # Release events and explicit package-type=release → clean X.Y.Z.
  # Push to main + package-type=snapshot → snapshot build.
  # Pull requests fall through to the cmake dev default.
  SYNERGY_VERSION_RELEASE: ${{ github.event_name == 'release' || github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.package-type == 'release') }}
  SYNERGY_VERSION_SNAPSHOT: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.package-type == 'snapshot' }}
  # A manual release must publish an incremented version; its patch is computed
  # from existing tags so a new GitHub Release is created for every build.
  SYNERGY_VERSION_AUTO_BUMP: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.package-type == 'release' }}

jobs:
  # ---------------------------------------------------------------------------
  # 1. Prepare. Every event starts here. The plan step records which
  # platforms this event is allowed to build.
  # ---------------------------------------------------------------------------
  get-version:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      version: ${{ steps.get-version.outputs.version }}
      base: ${{ steps.get-version.outputs.base }}
      patch: ${{ steps.get-version.outputs.patch }}
      linux_targets: ${{ steps.plan.outputs.targets }}
      build_windows: ${{ steps.plan.outputs.build_windows }}
      build_macos: ${{ steps.plan.outputs.build_macos }}
      build_linux: ${{ steps.plan.outputs.build_linux }}
      build_flatpak: ${{ steps.plan.outputs.build_flatpak }}
      publish_release: ${{ steps.plan.outputs.publish_release }}
      skip_unchanged: ${{ steps.plan.outputs.skip_unchanged }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Get version
        id: get-version
        uses: ./.github/actions/get-version

      - name: Check vcpkg version matches Version.cmake
        run: python3 scripts/ci/check-version-consistency.py

      # One place decides what this event builds. Job `if`s only read these
      # outputs, so a platform is not accidentally both required and skipped.
      # pull_request: free Linux. release and explicit package-type=release:
      # Windows and macOS and a GitHub Release. snapshot: honor platform; all or legacy blank means all.
      - name: Plan builds for this event
        id: plan
        env:
          PACKAGE_TYPE: ${{ inputs.package-type }}
          PLATFORM: ${{ inputs.platform }}
          VERSION_BASE: ${{ steps.get-version.outputs.base }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          linux_key=free
          build_windows=false
          build_macos=false
          build_linux=false
          build_flatpak=false
          publish_release=false
          skip_unchanged=false
          case "$GITHUB_EVENT_NAME" in
            pull_request)
              linux_key=free
              build_windows=true
              build_macos=true
              build_linux=true
              ;;
            release)
              # Release packaging is Windows and macOS only; Linux packages are
              # validated by the free push/PR subset but not published.
              build_windows=true
              build_macos=true
              publish_release=true
              ;;
            workflow_dispatch)
              linux_key=full
              if [ "$PACKAGE_TYPE" = "release" ]; then
                # Release packaging is Windows and macOS only; Linux packages are
                # validated by the free push/PR subset but not published.
                build_windows=true
                build_macos=true
                publish_release=true
              else
                if [ -z "$PLATFORM" ] || [ "$PLATFORM" = "all" ] || [ "$PLATFORM" = "windows" ]; then
                  build_windows=true
                fi
                if [ -z "$PLATFORM" ] || [ "$PLATFORM" = "all" ] || [ "$PLATFORM" = "macos" ]; then
                  build_macos=true
                fi
                if [ -z "$PLATFORM" ] || [ "$PLATFORM" = "all" ] || [ "$PLATFORM" = "linux" ]; then
                  build_linux=true
                  build_flatpak=true
                fi
                if [ "$PLATFORM" = "flatpak" ]; then
                  build_flatpak=true
                fi
              fi
              ;;
            *)
              echo "::error::unexpected event $GITHUB_EVENT_NAME"
              exit 1
              ;;
          esac
          targets=$(jq -c --arg k "$linux_key" '.[$k] | map(. + {"expected-arch": (if (.name | endswith("-arm64")) then "arm64" elif (.name | endswith("-x86_64")) then "x64" else error("unsupported declared Linux target") end)})' .github/matrices/linux-targets.json)
          {
            echo "targets=$targets"
            echo "build_windows=$build_windows"
            echo "build_macos=$build_macos"
            echo "build_linux=$build_linux"
            echo "build_flatpak=$build_flatpak"
            echo "publish_release=$publish_release"
            echo "skip_unchanged=$skip_unchanged"
          } >> "$GITHUB_OUTPUT"
          echo "plan event=$GITHUB_EVENT_NAME package=${PACKAGE_TYPE:-<none>} platform=${PLATFORM:-<none>} linux_matrix=$linux_key windows=$build_windows macos=$build_macos linux=$build_linux flatpak=$build_flatpak publish=$publish_release skip=$skip_unchanged"

  lint-clang:
    needs: get-version
    if: needs.get-version.outputs.skip_unchanged != 'true'
    runs-on: ubuntu-slim
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Clang-format
        uses: ./.github/actions/lint-clang

  # Reads scripts/ci/encoding-check.json. on_violation defaults to fail, so a
  # bad file stops the build jobs. Set it to warn to print and continue.
  lint-encoding:
    needs: get-version
    if: needs.get-version.outputs.skip_unchanged != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check source encoding
        run: python3 scripts/ci/check-encoding.py

      # lupdate only adds new tr() sources as unfinished; without this gate a
      # new dialog would silently ship in English on a Chinese system.
      - name: Check Chinese translations
        run: python3 scripts/ci/check-translations.py

  # ---------------------------------------------------------------------------
  # 2. Build. One CMake configure line per OS; the runner compiler differs.
  # Windows: MSVC + Ninja. macOS: AppleClang (arm64 and x86_64). Linux: gcc.
  # ---------------------------------------------------------------------------
  build-windows:
    needs: [lint-encoding, lint-clang, get-version]
    if: ${{ needs.get-version.outputs.build_windows == 'true' }}
    name: ${{ matrix.target.name }}
    runs-on: ${{ matrix.target.runs-on }}
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read

    env:
      SYNERGY_VERSION_PATCH: ${{ needs.get-version.outputs.patch }}
      # SignPath Foundation holds the code-signing key. The API token is the only
      # secret. Organization id and project slug are Actions variables assigned
      # after the project is approved. Missing any of them leaves the package unsigned.
      WINDOWS_SIGNING: ${{ needs.get-version.outputs.publish_release == 'true' && secrets.SIGNPATH_API_TOKEN != '' && vars.SIGNPATH_ORGANIZATION_ID != '' && vars.SIGNPATH_PROJECT_SLUG != '' }}

    strategy:
      fail-fast: false
      matrix:
        target:
          - name: "windows-2022-x64"
            runs-on: "windows-2022"
            vcpkg-triplet: x64-windows-release
            arch: "amd64"
            qt-version: 6.10.3

          - name: "windows-2022-arm64"
            runs-on: "windows-11-arm"
            vcpkg-triplet: arm64-windows
            arch: "arm64"
            qt-version: 6.11.1

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      # Stage: toolchain. vcvars via setup-msvc-dev; Qt from the CI Qt build, OpenSSL from vcpkg.
      - name: Setup VC++ environment
        uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: ${{ matrix.target.arch }}
          spectre: true

      - name: Install dependencies
        id: get-deps
        uses: ./.github/actions/install-dependencies
        with:
          qt-version: ${{ matrix.target.qt-version }}
          vcpkg-triplet: ${{ matrix.target.vcpkg-triplet }}

      - name: Update Windows Paths
        shell: cmd
        run: |
          if exist "%ProgramFiles%\doxygen\bin\doxygen.exe" echo %ProgramFiles%\doxygen\bin>>"%GITHUB_PATH%"
          if exist "%ProgramFiles(x86)%\doxygen\bin\doxygen.exe" echo %ProgramFiles(x86)%\doxygen\bin>>"%GITHUB_PATH%"

      # Stage: compile. GUI must be synergy_<X.Y.Z>.exe; core and daemon stay unversioned.
      - name: Configure
        run: ${{ env.CMAKE_CONFIGURE }} -G Ninja ${{ steps.get-deps.outputs.vcpkg-cmake-config }} -DSYNERGY_VERSION_RELEASE=${{ env.SYNERGY_VERSION_RELEASE }} -DSYNERGY_VERSION_SNAPSHOT=${{ env.SYNERGY_VERSION_SNAPSHOT }} -DSYNERGY_CI_QT_NOTICES="${{ steps.get-deps.outputs.qt-notice-root }}" -DSYNERGY_CI_QT_NOTICES_SHA256="${{ steps.get-deps.outputs.qt-notice-sha256 }}"

      - name: Build
        shell: bash
        run: cmake --build build --config Release -j8

      - name: GUI configuration tests
        env:
          QT_QPA_PLATFORM: offscreen
        shell: bash
        run: |
          set -euo pipefail
          cache=build/CMakeCache.txt
          test -f "$cache" || { echo 'Missing configured CMake cache'; exit 1; }
          value() { sed -n "s/^$1:[^=]*=//p" "$cache"; }
          build_tests=$(value BUILD_TESTS)
          skip_build_tests=$(value SKIP_BUILD_TESTS)
          qt_dir=$(value QT_DIR)
          case "$build_tests:$skip_build_tests" in
            ON:ON|ON:OFF|OFF:ON|OFF:OFF) ;;
            *) echo 'Unknown or conflicting test configuration'; exit 1 ;;
          esac
          qt_major=unknown
          if [ -f "$qt_dir/Qt5Config.cmake" ] && [ ! -f "$qt_dir/Qt6Config.cmake" ]; then
            qt_major=5
          elif [ -f "$qt_dir/Qt6Config.cmake" ] && [ ! -f "$qt_dir/Qt5Config.cmake" ]; then
            qt_major=6
          else
            echo 'Unknown or conflicting selected Qt configuration'; exit 1
          fi
          printf 'GUI configuration: BUILD_TESTS=%s SKIP_BUILD_TESTS=%s QT_DIR=%s QT_VERSION_MAJOR=%s\n' "$build_tests" "$skip_build_tests" "$qt_dir" "$qt_major"
          if [ "$RUNNER_OS" = Linux ] && { [ "$build_tests" = OFF ] || [ "$qt_major" = 5 ]; }; then
            echo 'Not Run: GUI configuration tests disabled by recorded CMake/Qt configuration'
            exit 0
          fi
          if [ "$build_tests" != ON ] || [ "$qt_major" != 6 ]; then
            echo 'Required native GUI configuration tests are unavailable'; exit 1
          fi
          test -d build/src/unittests || { echo 'Missing required Qt6 test directory'; exit 1; }
          for suite in ScreenTests ScreenSetupModelTests ValidatorTests; do
            ctest --test-dir build/src/unittests --build-config Release --output-on-failure --no-tests=error -R "^${suite}$"
          done

      # Iron rule: the GUI file is synergy_<X.Y.Z>.exe. X.Y.Z is get-version's
      # base, which SaveVersion.cmake reads from Version.cmake. core and daemon
      # stay unversioned so the GUI can still launch them.
      - name: Require synergy_<version>.exe
        id: gui-exe
        shell: bash
        run: |
          set -euo pipefail
          base="${{ needs.get-version.outputs.base }}"
          ver="${{ needs.get-version.outputs.version }}"
          # Release builds must land exactly on the base version; snapshot and
          # dev builds carry a suffix (X.Y.Z[-STAGE]-snapshot+rN) and only have
          # to stay derived from it, which also matches the GUI exe name rule.
          if [ "${{ env.SYNERGY_VERSION_RELEASE }}" = "true" ] && [ "$ver" != "$base" ]; then
            echo "::error::release version must be ${base}, got ${ver}"
            exit 1
          fi
          if [ "${{ env.SYNERGY_VERSION_RELEASE }}" != "true" ] && [[ "$ver" != "$base"* ]]; then
            echo "::error::version ${ver} does not start with base ${base}"
            exit 1
          fi
          count=$(find build/bin -type f -name "synergy_${base}.exe" | wc -l)
          if [ "$count" -ne 1 ]; then
            echo "::error::expected exactly one synergy_${base}.exe, found ${count}"
            find build/bin -type f -name '*.exe' || true
            exit 1
          fi
          exe=$(find build/bin -type f -name "synergy_${base}.exe")
          dir=$(dirname "$exe")
          test -f "$dir/synergy-core.exe"
          test -f "$dir/synergy-daemon.exe"
          echo "path=$exe" >> "$GITHUB_OUTPUT"
          echo "GUI exe: $exe"

      # Stage: sign executables before WiX embeds them. Skipped until the
      # SignPath Foundation project is approved and the Actions secret and
      # variables exist. The package is still produced, unsigned.
      - name: Windows signing not configured
        if: env.SYNERGY_VERSION_RELEASE == 'true' && env.WINDOWS_SIGNING != 'true'
        shell: bash
        run: echo "Windows code signing skipped. Apply at https://signpath.org/ and set SIGNPATH_API_TOKEN plus SIGNPATH_ORGANIZATION_ID and SIGNPATH_PROJECT_SLUG. Artifacts from this run are unsigned."

      - name: Stage binaries for signing
        if: env.SYNERGY_VERSION_RELEASE == 'true' && env.WINDOWS_SIGNING == 'true'
        shell: cmd
        run: scripts\ci\ci-windows-signing.bat stage

      - name: Upload unsigned executables
        if: env.SYNERGY_VERSION_RELEASE == 'true' && env.WINDOWS_SIGNING == 'true'
        id: upload-unsigned-exes
        uses: actions/upload-artifact@v7
        with:
          name: unsigned-signpath-exes-${{ matrix.target.name }}
          path: ${{ runner.temp }}\sign-stage\in\*.exe
          retention-days: 1
          if-no-files-found: error

      - name: Sign executables with SignPath Foundation
        if: env.SYNERGY_VERSION_RELEASE == 'true' && env.WINDOWS_SIGNING == 'true'
        id: sign-exes
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG || 'release-signing' }}
          artifact-configuration-slug: windows-executables
          github-artifact-id: ${{ steps.upload-unsigned-exes.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 1200
          output-artifact-directory: ${{ runner.temp }}\sign-stage\out

      - name: Restore + verify signed binaries
        if: env.SYNERGY_VERSION_RELEASE == 'true' && env.WINDOWS_SIGNING == 'true'
        shell: cmd
        run: scripts\ci\ci-windows-signing.bat restore

      - name: Upload synergy_<version>.exe
        if: ${{ needs.get-version.outputs.publish_release == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: synergy_${{ needs.get-version.outputs.base }}.exe
          path: ${{ steps.gui-exe.outputs.path }}
          if-no-files-found: error

      - name: Package
        shell: bash
        run: cmake --build build --config Release -j8 --target package

      - name: Locate MSI
        if: env.SYNERGY_VERSION_RELEASE == 'true' && env.WINDOWS_SIGNING == 'true'
        id: locate-msi
        shell: cmd
        run: scripts\ci\ci-windows-signing.bat locate-msi

      - name: Upload unsigned MSI
        if: env.SYNERGY_VERSION_RELEASE == 'true' && env.WINDOWS_SIGNING == 'true'
        id: upload-unsigned-msi
        uses: actions/upload-artifact@v7
        with:
          name: unsigned-signpath-msi-${{ matrix.target.name }}
          path: ${{ steps.locate-msi.outputs.path }}
          archive: false
          retention-days: 1
          if-no-files-found: error

      - name: Sign MSI with SignPath Foundation
        if: env.SYNERGY_VERSION_RELEASE == 'true' && env.WINDOWS_SIGNING == 'true'
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG || 'release-signing' }}
          artifact-configuration-slug: windows-msi
          github-artifact-id: ${{ steps.upload-unsigned-msi.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 1200
          output-artifact-directory: ${{ runner.temp }}\sign-stage\msi
          skip-decompress: true

      - name: Replace MSI with the signed file
        if: env.SYNERGY_VERSION_RELEASE == 'true' && env.WINDOWS_SIGNING == 'true'
        shell: cmd
        env:
          MSI_PATH: ${{ steps.locate-msi.outputs.path }}
          SIGNED_MSI_DIR: ${{ runner.temp }}\sign-stage\msi
        run: scripts\ci\ci-windows-signing.bat replace-msi

      - name: Verify MSI is signed
        if: env.SYNERGY_VERSION_RELEASE == 'true' && env.WINDOWS_SIGNING == 'true'
        shell: cmd
        env:
          MSI_PATH: ${{ steps.locate-msi.outputs.path }}
        run: scripts\ci\ci-windows-signing.bat verify-msi

      # Stage: test the build and the package, then upload it.
      - name: Unit tests
        uses: ./.github/actions/run-tests
        timeout-minutes: 2

      - name: Test packaged build
        uses: ./.github/actions/test-package
        with:
          expected-arch: ${{ matrix.target.arch }}

      - name: Upload package
        if: ${{ needs.get-version.outputs.publish_release == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: package-${{ env.PACKAGE_PREFIX }}-${{ needs.get-version.outputs.version }}-${{ matrix.target.name }}
          path: ${{ github.workspace }}/build/${{ env.PACKAGE_PREFIX }}[-_]*.*
          retention-days: 14

  build-macos:
    needs: [lint-encoding, lint-clang, get-version]
    if: ${{ needs.get-version.outputs.build_macos == 'true' }}
    name: ${{ matrix.target.name }}
    runs-on: ${{ matrix.target.runs-on }}
    timeout-minutes: ${{ matrix.target.timeout }}

    env:
      SYNERGY_VERSION_PATCH: ${{ needs.get-version.outputs.patch }}
      MAC_SIGNING: ${{ needs.get-version.outputs.publish_release == 'true' && secrets.APPLE_CODESIGN_ID != '' }}
      MAC_CODESIGN_ID: ${{ needs.get-version.outputs.publish_release == 'true' && secrets.APPLE_CODESIGN_ID || '' }}

    strategy:
      fail-fast: false
      matrix:
        target:
          - name: "macos-arm64"
            expected-arch: arm64
            runs-on: macos-15
            timeout: 20
            qt-version: 6.11.1
            # These CI artifacts use providers built for macOS 15. The local
            # manifest build retains its separately checked requested floor.
            config-args: '-DCMAKE_OSX_ARCHITECTURES="arm64" -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0'

          - name: "macos-x64"
            expected-arch: x64
            runs-on: macos-15-intel
            timeout: 30
            qt-version: 6.9.3
            config-args: '-DCMAKE_OSX_ARCHITECTURES="x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0'

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      # Stage: toolchain, then compile. Qt comes from the CI Qt build.
      - name: Install dependencies
        id: get-deps
        uses: ./.github/actions/install-dependencies
        with:
          qt-version: ${{ matrix.target.qt-version }}

      - name: Configure
        shell: bash
        run: |
          set -euo pipefail
          openssl_root=$(brew --prefix openssl@3)
          ${{ env.CMAKE_CONFIGURE }} ${{ matrix.target.config-args }} -DSYNERGY_VERSION_RELEASE=${{ env.SYNERGY_VERSION_RELEASE }} -DSYNERGY_VERSION_SNAPSHOT=${{ env.SYNERGY_VERSION_SNAPSHOT }} -DAPPLE_CODESIGN_ID="${{ needs.get-version.outputs.publish_release == 'true' && secrets.APPLE_CODESIGN_ID || '' }}" -DOPENSSL_ROOT_DIR="$openssl_root" -DSYNERGY_CI_QT_NOTICES="${{ steps.get-deps.outputs.qt-notice-root }}" -DSYNERGY_CI_QT_NOTICES_SHA256="${{ steps.get-deps.outputs.qt-notice-sha256 }}"

      - name: Build
        shell: bash
        run: cmake --build build --config Release -j8

      - name: GUI configuration tests
        env:
          QT_QPA_PLATFORM: offscreen
        shell: bash
        run: |
          set -euo pipefail
          cache=build/CMakeCache.txt
          test -f "$cache" || { echo 'Missing configured CMake cache'; exit 1; }
          value() { sed -n "s/^$1:[^=]*=//p" "$cache"; }
          build_tests=$(value BUILD_TESTS)
          skip_build_tests=$(value SKIP_BUILD_TESTS)
          qt_dir=$(value QT_DIR)
          case "$build_tests:$skip_build_tests" in
            ON:ON|ON:OFF|OFF:ON|OFF:OFF) ;;
            *) echo 'Unknown or conflicting test configuration'; exit 1 ;;
          esac
          qt_major=unknown
          if [ -f "$qt_dir/Qt5Config.cmake" ] && [ ! -f "$qt_dir/Qt6Config.cmake" ]; then
            qt_major=5
          elif [ -f "$qt_dir/Qt6Config.cmake" ] && [ ! -f "$qt_dir/Qt5Config.cmake" ]; then
            qt_major=6
          else
            echo 'Unknown or conflicting selected Qt configuration'; exit 1
          fi
          printf 'GUI configuration: BUILD_TESTS=%s SKIP_BUILD_TESTS=%s QT_DIR=%s QT_VERSION_MAJOR=%s\n' "$build_tests" "$skip_build_tests" "$qt_dir" "$qt_major"
          if [ "$RUNNER_OS" = Linux ] && { [ "$build_tests" = OFF ] || [ "$qt_major" = 5 ]; }; then
            echo 'Not Run: GUI configuration tests disabled by recorded CMake/Qt configuration'
            exit 0
          fi
          if [ "$build_tests" != ON ] || [ "$qt_major" != 6 ]; then
            echo 'Required native GUI configuration tests are unavailable'; exit 1
          fi
          test -d build/src/unittests || { echo 'Missing required Qt6 test directory'; exit 1; }
          for suite in ScreenTests ScreenSetupModelTests ValidatorTests; do
            ctest --test-dir build/src/unittests --build-config Release --output-on-failure --no-tests=error -R "^${suite}$"
          done

      # Stage: sign and notarize, only when APPLE_CODESIGN_ID is set.
      # Create an ephemeral keychain just for this run and import the Developer
      # ID Application certificate from the base64-encoded P12 in secrets. Using
      # a per-run keychain (rather than System.keychain) keeps the cert out of
      # any shared state on the runner; the keychain is destroyed at job end.
      # set-key-partition-list grants codesign passwordless access so the later
      # sign step doesn't prompt.
      - name: Set up signing keychain
        if: env.MAC_SIGNING == 'true'
        shell: bash
        env:
          APPLE_P12_CERTIFICATE: ${{ secrets.APPLE_P12_CERTIFICATE }}
          APPLE_P12_PASSWORD: ${{ secrets.APPLE_P12_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/sign.keychain-db"
          keychain_pass=$(openssl rand -base64 32)
          security create-keychain -p "$keychain_pass" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$keychain_pass" "$keychain"
          keychains=()
          while IFS= read -r existing; do
            keychains+=("$existing")
          done < <(security list-keychains -d user | sed 's/^[[:space:]]*"//; s/"[[:space:]]*$//')
          security list-keychains -d user -s "$keychain" "${keychains[@]}"
          cert_file="$RUNNER_TEMP/cert.p12"
          echo "$APPLE_P12_CERTIFICATE" | base64 --decode > "$cert_file"
          security import "$cert_file" -k "$keychain" -P "$APPLE_P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_pass" "$keychain"
          rm -f "$cert_file"
          echo "SIGN_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
          echo "SIGN_KEYCHAIN_PASS=$keychain_pass" >> "$GITHUB_ENV"

      # CPack runs macdeployqt and, when a Developer ID is configured, codesigns
      # the bundle that gets embedded in the DMG (see deploy/mac/deploy.cmake), so
      # the keychain must be unlocked first. CPack on macOS is flaky; retry a
      # handful of times before failing.
      - name: Package
        shell: bash
        run: |
          if [ -n "$SIGN_KEYCHAIN" ]; then
            security unlock-keychain -p "$SIGN_KEYCHAIN_PASS" "$SIGN_KEYCHAIN"
          fi
          for i in $(seq 1 5); do
            if cmake --build build --config Release -j8 --target package 2>&1; then
              echo "Package successful"
              exit 0
            fi
            echo "Package attempt $i failed"
            sleep 1
          done
          echo "ERROR: package failed after 5 attempts" >&2
          exit 1

      # Sign the DMG itself so Gatekeeper trusts it before extraction. Then
      # submit to notarytool (synchronous via --wait) and staple the returned
      # ticket so Gatekeeper can verify offline.
      - name: Sign + notarize + staple DMG
        if: env.MAC_SIGNING == 'true'
        shell: bash
        env:
          APPLE_CODESIGN_ID: ${{ secrets.APPLE_CODESIGN_ID }}
          APPLE_NOTARY_USER: ${{ secrets.APPLE_NOTARY_USER }}
          APPLE_NOTARY_PASSWORD: ${{ secrets.APPLE_NOTARY_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          dmg=$(find build -maxdepth 2 -name "*.dmg" -type f | head -n1)
          if [ -z "$dmg" ]; then
            echo "ERROR: no DMG found under build/" >&2
            find build -maxdepth 2 -name "*.dmg" 2>/dev/null
            exit 1
          fi
          echo "Found DMG: $dmg"

          security unlock-keychain -p "$SIGN_KEYCHAIN_PASS" "$SIGN_KEYCHAIN"
          /usr/bin/codesign --force --timestamp --sign "$APPLE_CODESIGN_ID" "$dmg"

          result=$(xcrun notarytool submit "$dmg" \
            --apple-id "$APPLE_NOTARY_USER" \
            --password "$APPLE_NOTARY_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --output-format json --wait)
          echo "$result"
          id=$(echo "$result" | python3 -c "import sys, json; print(json.load(sys.stdin)['id'])")
          status=$(echo "$result" | python3 -c "import sys, json; print(json.load(sys.stdin)['status'])")
          if [ "$status" != "Accepted" ]; then
            echo "Notarization $status; per-file detail follows:" >&2
            xcrun notarytool log "$id" \
              --apple-id "$APPLE_NOTARY_USER" \
              --password "$APPLE_NOTARY_PASSWORD" \
              --team-id "$APPLE_TEAM_ID"
            exit 1
          fi

          xcrun stapler staple "$dmg"
          xcrun stapler validate "$dmg"
          spctl -a -t open --context context:primary-signature -v "$dmg"
          echo "DMG signed + notarized + stapled: $dmg"

      # Stage: test the build and the package, then upload it.
      - name: Unit tests
        uses: ./.github/actions/run-tests
        timeout-minutes: 2

      - name: Test packaged build
        uses: ./.github/actions/test-package
        with:
          expected-arch: ${{ matrix.target.expected-arch }}

      - name: Upload package
        if: ${{ needs.get-version.outputs.publish_release == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: package-${{ env.PACKAGE_PREFIX }}-${{ needs.get-version.outputs.version }}-${{ matrix.target.name }}
          path: ${{ github.workspace }}/build/${{ env.PACKAGE_PREFIX }}[-_]*.*
          retention-days: 14

  build-linux:
    needs: [lint-encoding, lint-clang, get-version]
    if: ${{ needs.get-version.outputs.build_linux == 'true' }}
    name: ${{ matrix.target.name }}
    runs-on: ${{ matrix.target.runs-on }}
    container:
      image: ${{ matrix.target.container }}
      volumes:
        - /etc/ssl/certs/ca-certificates.crt:/run/synergy-ci/host-ca-certificates.crt:ro
    timeout-minutes: 20
    env:
      SYNERGY_VERSION_PATCH: ${{ needs.get-version.outputs.patch }}
    strategy:
      fail-fast: false
      matrix:
        # free or full, chosen by the plan step in get-version.
        target: ${{ fromJSON(needs.get-version.outputs.linux_targets) }}

    steps:
      # Stage: container toolchain. The image has no git, and it runs as root.
      # Containers don't ship git; everything else needs it for checkout + describe.
      # This pre-checkout step runs at the workspace root, which always exists.
      - name: Install Git on Container
        shell: bash
        run: |
          # BEGIN SYNERGY_CI_APT_BOOTSTRAP
          synergy_ci_bootstrap_debian() {
            local apt_root="$1" ca_path="$2" os_release_path="$3"
            local os_id source_file source_format newline_count temporary
            os_id=$(awk -F '=' '
              $1 == "ID" {
                value = substr($0, 4)
                quote = substr(value, 1, 1)
                if ((quote == "\"" || quote == sprintf("%c", 39)) &&
                    substr(value, length(value), 1) == quote)
                  value = substr(value, 2, length(value) - 2)
                print value
                exit
              }
            ' "$os_release_path") || return $?
            if [ "$os_id" != "ubuntu" ]; then
              apt-get update -qqq > /dev/null && apt-get install -qqq git devscripts > /dev/null
              return $?
            fi
            if [ ! -f "$ca_path" ] || [ ! -r "$ca_path" ] || [ ! -s "$ca_path" ]; then
              printf '%s\n' 'Ubuntu APT bootstrap requires a readable, nonempty public CA file.' >&2
              return 1
            fi
            for source_file in "$apt_root/sources.list" "$apt_root"/sources.list.d/*.list "$apt_root"/sources.list.d/*.sources; do
              [ -f "$source_file" ] || continue
              if [ -L "$source_file" ]; then
                printf '%s\n' 'Ubuntu APT bootstrap refuses a linked source file.' >&2
                return 1
              fi
              case "$source_file" in
                *.sources) source_format=deb822 ;;
                *) source_format=list ;;
              esac
              newline_count=$(wc -l < "$source_file") || return $?
              temporary=$(mktemp) || return $?
              if ! awk -v format="$source_format" -v newlines="$newline_count" '
                function uri(value) {
                  if (value ~ /^http:\/\/(archive\.ubuntu\.com|security\.ubuntu\.com)\/ubuntu\/?$/ ||
                      value ~ /^http:\/\/ports\.ubuntu\.com\/ubuntu-ports\/?$/)
                    return "https" substr(value, 5)
                  return value
                }
                function values(text, result, token) {
                  result = ""
                  while (length(text)) {
                    if (match(text, /^[ \t]+/)) {
                      result = result substr(text, 1, RLENGTH)
                    } else {
                      if (substr(text, 1, 1) == "#")
                        return result text
                      match(text, /^[^ \t]+/)
                      token = substr(text, 1, RLENGTH)
                      result = result uri(token)
                    }
                    text = substr(text, RLENGTH + 1)
                  }
                  return result
                }
                function legacy(text, position, rest, token) {
                  if (!match(text, /^[ \t]*(deb|deb-src)[ \t]+/))
                    return text
                  position = RLENGTH + 1
                  rest = substr(text, position)
                  if (substr(rest, 1, 1) == "[") {
                    if (!match(rest, /^\[[^]]*\][ \t]+/))
                      return text
                    position += RLENGTH
                  }
                  if (!match(substr(text, position), /^[^ \t]+/))
                    return text
                  token = substr(text, position, RLENGTH)
                  return substr(text, 1, position - 1) uri(token) substr(text, position + length(token))
                }
                function stanza(first, last, i, text, colon, field, value, active) {
                  for (i = first; i <= last; i++) {
                    text = lines[i]
                    if (tolower(substr(text, 1, 8)) == "enabled:") {
                      value = substr(text, 9)
                      gsub(/^[ \t]+|[ \t]+$/, "", value)
                      if (tolower(value) == "no")
                        return
                    }
                  }
                  active = 0
                  for (i = first; i <= last; i++) {
                    text = lines[i]
                    if (text ~ /^[ \t]*#/)
                      continue
                    if (text ~ /^[^ \t:]+:/) {
                      colon = index(text, ":")
                      field = tolower(substr(text, 1, colon - 1))
                      active = field == "uris"
                      if (active)
                        lines[i] = substr(text, 1, colon) values(substr(text, colon + 1))
                    } else if (text ~ /^[ \t]/ && active) {
                      lines[i] = values(text)
                    } else {
                      active = 0
                    }
                  }
                }
                { lines[NR] = $0 }
                END {
                  if (format == "deb822") {
                    first = 1
                    for (last = 1; last <= NR + 1; last++) {
                      if (last > NR || lines[last] ~ /^[ \t]*$/) {
                        stanza(first, last - 1)
                        first = last + 1
                      }
                    }
                  } else {
                    for (i = 1; i <= NR; i++)
                      lines[i] = legacy(lines[i])
                  }
                  for (i = 1; i <= NR; i++) {
                    printf "%s", lines[i]
                    if (i <= newlines)
                      printf "\n"
                  }
                }
              ' "$source_file" > "$temporary"; then
                rm -f "$temporary"
                return 1
              fi
              if ! cat "$temporary" > "$source_file"; then
                rm -f "$temporary"
                return 1
              fi
              rm -f "$temporary" || return $?
            done
            printf '%s\n' 'Ubuntu APT bootstrap: update using verified HTTPS.'
            apt-get update -o "Acquire::https::CAInfo=$ca_path" || return $?
            printf '%s\n' 'Ubuntu APT bootstrap: install system CA certificates and Git tools.'
            apt-get install -y -o "Acquire::https::CAInfo=$ca_path" ca-certificates git devscripts || return $?
          }
          # END SYNERGY_CI_APT_BOOTSTRAP
          if [ "${{ matrix.target.like }}" == "debian" ]; then
            synergy_ci_bootstrap_debian /etc/apt /run/synergy-ci/host-ca-certificates.crt /etc/os-release
          elif [ "${{ matrix.target.like }}" == "fedora" ]; then
            dnf install -y git
          elif [ "${{ matrix.target.like }}" == "suse" ]; then
            zypper refresh
            zypper install -y --force-resolution git
          elif [ "${{ matrix.target.like }}" == "arch" ]; then
            pacman -Syu --noconfirm git
          elif [ "${{ matrix.target.like }}" == "rhel" ]; then
            dnf install -y git
          else
            echo "Unknown: ${{ matrix.target.like }}"
          fi

      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      # The container runs as root over a host-owned workspace, so git rejects it as
      # dubious-owned and the Configure step's `git describe` degrades the rev count
      # to 0, naming packages +r0 while non-container builds use the real count.
      - name: Trust workspace for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install dependencies
        uses: ./.github/actions/install-dependencies
        with:
          like: ${{ matrix.target.like }}

      # 24.04's system libportal (0.7.x) lacks the input-capture portal the code needs
      # (>= 0.8.0), and that LTS's libs are frozen. Build a newer libportal and static-link
      # it so the shipped binary carries no runtime dependency on a >= 0.8 system libportal
      # (libei from the system is fine). The code uses no xdp_parent, so no GUI backend is
      # needed, and removing the system .so makes `-lportal` resolve to the static archive.
      - name: Build newer libportal (Ubuntu 24.04)
        if: startsWith(matrix.target.name, 'ubuntu-24.04')
        shell: bash
        run: |
          apt-get install -y -qq meson pkg-config
          git clone --depth 1 --branch 0.9.1 https://github.com/flatpak/libportal.git /tmp/libportal
          portal_commit=$(git -C /tmp/libportal rev-parse HEAD)
          test "$portal_commit" = 8f5dc8d192f6e31dafe69e35219e3b707bde71ce
          meson setup /tmp/libportal/_build /tmp/libportal --prefix=/usr --libdir="lib/$(gcc -dumpmachine)" \
            --default-library=static \
            -Dbackend-gtk3=disabled -Dbackend-gtk4=disabled -Dbackend-qt5=disabled -Dbackend-qt6=disabled \
            -Ddocs=false -Dintrospection=false -Dvapi=false -Dtests=false
          meson install -C /tmp/libportal/_build
          license_dir=/usr/share/licenses/tupig-build/libportal
          mkdir -p "$license_dir"
          python3 - "$license_dir" "$portal_commit" <<'PY'
          import importlib.util
          import sys
          spec = importlib.util.spec_from_file_location("runtime_notices", "scripts/ci/prepare-runtime-notices.py")
          notices = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(notices)
          payload = notices.download_runtime_source("libportal", "0.9.1")
          notices.prepare("libportal", "0.9.1", payload, ["libportal.so.1"], sys.argv[1],
                          "static source build libportal 0.9.1 gitcommit " + sys.argv[2])
          PY
          rm -f "/usr/lib/$(gcc -dumpmachine)"/libportal.so*
          ldconfig

      # Stage: compile and package. Arch uses makepkg; every other distro uses CPack.
      - name: Configure
        shell: bash
        env:
          TARGET_NAME: ${{ matrix.target.name }}
        run: |
          license_args=()
          source_license_map=""
          notice_root="$PWD/build/ci-runtime-notices"
          providers=()
          case "$TARGET_NAME" in
            fedora-*) providers=(libdrm xcb-util-keysyms) ;;
            rocky-*) providers=(libdrm xcb-util-keysyms) ;;
            opensuse-*) providers=(libdrm libX11 libXext libXi libXinerama libXrandr libXrender libXtst
                                   brotli e2fsprogs gcc graphite2 krb5 icu mtdev libproxy tslib libxcb
                                   xcb-util-cursor xcb-util-wm xcb-util-image xcb-util-keysyms
                                   xcb-util-renderutil xcb-util) ;;
            archlinux-*) providers=(e2fsprogs glib libgudev libidn2 keyutils libportal libproxy systemd tslib libunistring) ;;
          esac
          for provider in "${providers[@]}"; do
            provider_map=$(python3 scripts/ci/prepare-runtime-notices.py \
              --provider "$provider" --destination "$notice_root")
            test -n "$provider_map"
            IFS=';' read -r -a provider_entries <<< "$provider_map"
            for entry in "${provider_entries[@]}"; do
              soname=${entry%%=*}
              if [[ ";$source_license_map;" == *";$soname="* ]]; then
                echo "ERROR: Duplicate runtime notice SONAME: $soname" >&2
                exit 1
              fi
            done
            source_license_map+="${source_license_map:+;}$provider_map"
          done
          if [[ "$TARGET_NAME" == ubuntu-24.04* ]]; then
            license_args=(-DSYNERGY_EXTRA_LICENSE_DIRS=/usr/share/licenses/tupig-build)
            source_license_map=libportal.so.1=/usr/share/licenses/tupig-build/libportal
          fi
          if [[ -n "$source_license_map" ]]; then
            license_args+=("-DSYNERGY_SOURCE_LICENSE_MAP=$source_license_map")
          fi
          ${{ env.CMAKE_CONFIGURE }} ${{ matrix.target.config-args }} -DSYNERGY_VERSION_RELEASE=${{ env.SYNERGY_VERSION_RELEASE }} -DSYNERGY_VERSION_SNAPSHOT=${{ env.SYNERGY_VERSION_SNAPSHOT }} "${license_args[@]}"

      - name: Build
        shell: bash
        run: cmake --build build --config Release -j8

      - name: GUI configuration tests
        env:
          QT_QPA_PLATFORM: offscreen
        shell: bash
        run: |
          set -euo pipefail
          cache=build/CMakeCache.txt
          test -f "$cache" || { echo 'Missing configured CMake cache'; exit 1; }
          value() { sed -n "s/^$1:[^=]*=//p" "$cache"; }
          build_tests=$(value BUILD_TESTS)
          skip_build_tests=$(value SKIP_BUILD_TESTS)
          qt_dir=$(value QT_DIR)
          case "$build_tests:$skip_build_tests" in
            ON:ON|ON:OFF|OFF:ON|OFF:OFF) ;;
            *) echo 'Unknown or conflicting test configuration'; exit 1 ;;
          esac
          qt_major=unknown
          if [ -f "$qt_dir/Qt5Config.cmake" ] && [ ! -f "$qt_dir/Qt6Config.cmake" ]; then
            qt_major=5
          elif [ -f "$qt_dir/Qt6Config.cmake" ] && [ ! -f "$qt_dir/Qt5Config.cmake" ]; then
            qt_major=6
          else
            echo 'Unknown or conflicting selected Qt configuration'; exit 1
          fi
          printf 'GUI configuration: BUILD_TESTS=%s SKIP_BUILD_TESTS=%s QT_DIR=%s QT_VERSION_MAJOR=%s\n' "$build_tests" "$skip_build_tests" "$qt_dir" "$qt_major"
          if [ "$RUNNER_OS" = Linux ] && { [ "$build_tests" = OFF ] || [ "$qt_major" = 5 ]; }; then
            echo 'Not Run: GUI configuration tests disabled by recorded CMake/Qt configuration'
            exit 0
          fi
          if [ "$build_tests" != ON ] || [ "$qt_major" != 6 ]; then
            echo 'Required native GUI configuration tests are unavailable'; exit 1
          fi
          test -d build/src/unittests || { echo 'Missing required Qt6 test directory'; exit 1; }
          for suite in ScreenTests ScreenSetupModelTests ValidatorTests; do
            ctest --test-dir build/src/unittests --build-config Release --output-on-failure --no-tests=error -R "^${suite}$"
          done

      - name: Package
        shell: bash
        run: |
          if [[ "${{ matrix.target.like }}" == "arch" ]]; then
            useradd -m build
            sudo chown -R build build
            cd build
            sudo -u build makepkg -s
            OSNAME=$(sed -n 's/^ID=//p' /etc/os-release | tr -d '"')
            [ "$OSNAME" = "arch" ] && OSNAME="arch-linux"
            ARCH=$(uname -m)
            mv ./*.pkg.tar.zst "${{ env.PACKAGE_PREFIX }}_${{ needs.get-version.outputs.version }}_${OSNAME}_${ARCH}.pkg.tar.zst"
            cd ..
          else
            cmake --build build --config Release -j8 --target package
          fi

      # Stage: test, then upload. RHEL skips the unit tests (Qt5 leg).
      - name: Unit tests
        if: ${{ matrix.target.like != 'rhel' }}
        uses: ./.github/actions/run-tests
        timeout-minutes: 2

      - name: Test packaged build
        uses: ./.github/actions/test-package
        with:
          expected-arch: ${{ matrix.target.expected-arch }}
          like: ${{ matrix.target.like }}

      - name: Upload package
        if: ${{ needs.get-version.outputs.publish_release == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: package-${{ env.PACKAGE_PREFIX }}-${{ needs.get-version.outputs.version }}-${{ matrix.target.name }}
          path: ${{ github.workspace }}/build/${{ env.PACKAGE_PREFIX }}[-_]*.*
          retention-days: 14

  build-flatpak:
    needs: [lint-encoding, lint-clang, get-version]
    if: ${{ needs.get-version.outputs.build_flatpak == 'true' }}
    name: flatpak-${{matrix.flatpak.arch}}
    runs-on: ${{matrix.flatpak.runs-on}}
    timeout-minutes: 90
    env:
      SYNERGY_VERSION_PATCH: ${{ needs.get-version.outputs.patch }}
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:kde-6.10
      options: --privileged
    strategy:
      fail-fast: false
      matrix:
        flatpak:
          - runs-on: ubuntu-latest
            arch: x86_64
          - runs-on: ubuntu-24.04-arm
            arch: aarch64
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - run: git config --global protocol.file.allow always

      # Stage: lint the metadata, build the bundle, then upload it.
      - name: Lint AppStream
        run: flatpak-builder-lint appstream deploy/linux/com.tupig.synergy.metainfo.xml

      # appid-url-not-reachable: the linter probes https://tupig.com (app-id
      # namespace), which fails TLS from CI - same class as A-39 (#63). Covered by
      # ci-build-lint-exceptions.json; without --exceptions this step hard-fails.
      - name: Lint manifest
        run: flatpak-builder-lint --exceptions --user-exceptions deploy/linux/flatpak/ci-build-lint-exceptions.json manifest deploy/linux/flatpak/com.tupig.synergy.yml

      # uses: steps resolve relative paths from GITHUB_WORKSPACE (the repo root).
      # The builder reads the manifest from deploy/ and writes repo/,
      # .flatpak-builder/ and the bundle at the workspace root; Validate/Upload
      # must anchor there too.
      - name: Build
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: ${{ env.PACKAGE_PREFIX }}_${{ needs.get-version.outputs.version }}_linux_${{ matrix.flatpak.arch }}.flatpak
          manifest-path: deploy/linux/flatpak/com.tupig.synergy.yml
          cache-key: flatpak-builder-${{matrix.flatpak.arch}}-2.0
          arch: ${{matrix.flatpak.arch}}
          upload-artifact: false
          restore-cache: true
          save-cache: false

      - name: Validate build
        run: flatpak-builder-lint --exceptions --user-exceptions deploy/linux/flatpak/ci-build-lint-exceptions.json repo repo

      - name: Export and verify complete offline repository
        shell: bash
        run: |
          scripts/ci/package-flatpak-offline.sh repo "${{ env.PACKAGE_PREFIX }}_${{ needs.get-version.outputs.version }}_linux_${{ matrix.flatpak.arch }}-flatpak-offline.tar.zst" "${{ matrix.flatpak.arch }}"

      - name: Upload package
        if: ${{ needs.get-version.outputs.publish_release == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: package-${{ env.PACKAGE_PREFIX }}-${{ needs.get-version.outputs.version }}-flatpak-${{matrix.flatpak.arch}}
          path: ${{github.workspace}}/${{ env.PACKAGE_PREFIX }}[-_]*-flatpak-offline.tar.zst
          retention-days: 14

  # Attach the CPack/Flatpak packages to the GitHub Release v<X.Y.Z>. Actions
  # artifacts expire; the Release page is what people download. Push and PR
  # skip this job. A failed distro does not drop packages that did build.
  # ---------------------------------------------------------------------------
  # 3. Publish. Release builds attach packages to the GitHub Release and,
  # when AWS secrets exist, copy them to S3. report runs only after a failure.
  # ---------------------------------------------------------------------------
  github-release:
    needs: [get-version, build-windows, build-macos, build-linux, build-flatpak]
    if: ${{ always() && needs.get-version.result == 'success' && needs.get-version.outputs.publish_release == 'true' && (needs.build-windows.result == 'success' || needs.build-macos.result == 'success' || needs.build-linux.result == 'success' || needs.build-flatpak.result == 'success') }}
    runs-on: ubuntu-latest
    # contents:write uploads the Release. id-token and attestations mint the
    # Sigstore provenance for those same bytes. Job permissions replace the
    # workflow default, so contents:write has to stay on this list.
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Download packages
        uses: actions/download-artifact@v8
        with:
          pattern: package-*
          path: dist
          merge-multiple: true

      - name: Hash release packages
        id: subjects
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(find dist -type f ! -name '*.digest' | sort)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::no package files to attest"
            exit 1
          fi
          sha256sum "${files[@]}" > "$RUNNER_TEMP/release-subjects.txt"
          echo "path=$RUNNER_TEMP/release-subjects.txt" >> "$GITHUB_OUTPUT"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: ${{ steps.subjects.outputs.path }}

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          # This job does not check out the repo. Without GH_REPO, gh tries
          # to run git and fails with "not a git repository".
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.get-version.outputs.base }}
        run: |
          set -euo pipefail
          shopt -s nullglob globstar
          mapfile -t files < <(find dist -type f ! -name '*.digest' | sort)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::no package files to publish"
            exit 1
          fi
          printf 'Publishing %s files to v%s\n' "${#files[@]}" "$VERSION"
          printf ' - %s\n' "${files[@]}"
          tag="v${VERSION}"
          title="TuPig Synergy ${VERSION}"
          # Every release must carry user-visible update notes. The body starts
          # with GitHub's generated notes (merged pull requests since the
          # previous release), then this footer documents provenance and
          # signing. Keep both bilingual: the project is Chinese-first.
          notes="## 发布信息 / Release information"$'\n\n'
          notes+="- 每个安装包都附带 GitHub 构建来源证明 / Every package carries a GitHub build-provenance attestation:"$'\n'
          notes+="  \`gh attestation verify FILE --repo Tupig/Tupig_synergy\`"$'\n'
          notes+="- Windows 包在 SignPath 审批前未签名 / Windows packages are unsigned until SignPath approval."$'\n'
          notes+="- macOS 包未使用 Developer ID 签名与公证，首次运行需在「系统设置 → 隐私与安全性 → 辅助功能」中授权；升级后如再次提示，请重新授权 / "
          notes+="macOS packages use an ad-hoc signature (no Developer ID, no notarization); grant Accessibility permission after the first launch and re-grant after an update if prompted."$'\n'
          marker="Built-From: ${GITHUB_SHA}"
          # A published release must have an incremented version: reusing a tag
          # for different code is exactly what the auto-bump prevents. A rerun
          # of the same commit may still refresh its own assets.
          if existing_sha=$(gh api "repos/${GH_REPO}/commits/${tag}" --jq .sha 2>/dev/null) &&
             [ -n "$existing_sha" ] && [ "$existing_sha" != "$GITHUB_SHA" ]; then
            echo "::error::Release ${tag} already points to ${existing_sha}; bump the version before publishing"
            exit 1
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${files[@]}" --clobber
            existing=$(gh release view "$tag" --json body -q .body)
            cleaned=$(printf '%s\n' "$existing" | tr -d '\r' | grep -v '^Built-From: ' || true)
            if [ -z "${cleaned//[[:space:]]/}" ]; then
              cleaned="$notes"
            fi
            gh release edit "$tag" --notes "${cleaned}"$'\n\n'"${marker}"
          else
            # --generate-notes lists the merged pull requests since the last
            # release; the edit appends the provenance/signing footer.
            gh release create "$tag" "${files[@]}" --title "$title" --generate-notes --latest
            generated=$(gh release view "$tag" --json body -q .body)
            gh release edit "$tag" --notes "${generated}"$'\n\n'"${notes}"$'\n\n'"${marker}"
          fi

  # Upload release packages to AWS S3 for distribution. Snapshot validation
  # never enters this job or reads AWS credentials. Release publication
  # uploads whatever artifacts exist - one failed target must not block shipping
  # the rest (a flaky distro should not discard other release artifacts).
  # The publication decision comes from get-version, which supplies the path. Layout: <dir>/<dev|snapshot|release>/<version>/...
  # No checkout (download-artifact only). Artifacts land at the workspace root under dist/.
  # Secrets cannot be referenced from a job-level `if` (context unavailable
  # there), so gate each AWS step individually: when secrets are unset the
  # job still runs but every upload step is skipped - job stays green (A-30 (#54)).
  s3-upload:
    needs: [get-version, build-windows, build-macos, build-linux, build-flatpak]
    # Publication only: push, pull request and snapshot runs never upload to S3.
    if: ${{ always() && needs.get-version.result == 'success' && needs.get-version.outputs.skip_unchanged != 'true' && needs.get-version.outputs.publish_release == 'true' && (github.event_name == 'workflow_dispatch' || github.event_name == 'release') }}
    runs-on: ubuntu-latest

    steps:
      - name: Check AWS secrets
        id: aws
        env:
          AWS_KEY: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          if [ -n "$AWS_KEY" ] && [ -n "$AWS_SECRET" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "AWS secrets not configured; skipping S3 upload."
          fi

      - name: Download all artifacts
        if: steps.aws.outputs.configured == 'true'
        uses: actions/download-artifact@v8
        with:
          pattern: package-*
          path: dist
          merge-multiple: true

      - name: Configure AWS credentials
        if: steps.aws.outputs.configured == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-2

      - name: Upload to AWS S3
        if: steps.aws.outputs.configured == 'true'
        shell: bash
        run: |
          version="${{ needs.get-version.outputs.version }}"
          s3_uri="${{ inputs.aws-s3-uri || format('s3://{0}/{1}', vars.AWS_S3_BUCKET, vars.AWS_S3_UPLOAD_DIR) }}"
          s3_uri="${s3_uri%/}"

          if [[ "${{ env.SYNERGY_VERSION_RELEASE }}" == "true" ]]; then
            sub_dir="release"
          elif [[ "${{ env.SYNERGY_VERSION_SNAPSHOT }}" == "true" ]]; then
            # Group snapshots by base version, keeping the stage so the folder
            # matches the release path (i.e. 1.21.2-beta/1.21.2-beta-snapshot+r42).
            base_version="${version%%-snapshot*}"
            sub_dir="snapshot/$base_version"
          else
            sub_dir="dev"
          fi

          url="$s3_uri/$sub_dir/$version"
          echo "Uploading to AWS S3: $url"
          aws s3 cp ./dist/ "$url" --recursive

  report:
    needs: [get-version, build-windows, build-macos, build-linux, build-flatpak, s3-upload]
    if: ${{ !cancelled() && needs.get-version.outputs.publish_release == 'true' && github.event_name != 'pull_request' && contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Build Slack message
        id: message
        shell: bash
        run: |
          link="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          {
            echo "text<<EOF"
            echo "<!channel>"
            printf '\342\235\214 Synergy CI failed\n'
            [ "${{ needs.build-windows.result }}" = "failure" ] && printf '\342\200\242 Windows build failed\n'
            [ "${{ needs.build-macos.result }}" = "failure" ] && printf '\342\200\242 macOS build failed\n'
            [ "${{ needs.build-linux.result }}" = "failure" ] && printf '\342\200\242 Linux build failed\n'
            [ "${{ needs.build-flatpak.result }}" = "failure" ] && printf '\342\200\242 Flatpak build failed\n'
            [ "${{ needs.s3-upload.result }}" = "failure" ] && printf '\342\200\242 S3 upload failed\n'
            echo "<$link|View workflow>"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Check Slack secrets
        id: slack
        shell: bash
        env:
          SLACK_TOKEN: ${{ secrets.SLACK_TOKEN }}
          SLACK_CHANNEL: ${{ secrets.SLACK_NOTIFY_CHANNEL_ID }}
        run: |
          if [ -n "$SLACK_TOKEN" ] && [ -n "$SLACK_CHANNEL" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Slack secrets not configured; skipping notification."
          fi

      - name: Send Slack notification
        if: steps.slack.outputs.configured == 'true'
        uses: slackapi/slack-github-action@v3
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_TOKEN }}
          payload: |
            channel: ${{ secrets.SLACK_NOTIFY_CHANNEL_ID }}
            text: ${{ toJSON(steps.message.outputs.text) }}

  # ---------------------------------------------------------------------------
  # 4. Analysis. Manual dispatch with analyze=true only. Push and pull
  # requests skip this whole group. Valgrind is the expensive container build.
  # ---------------------------------------------------------------------------
  clang-tidy:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.analyze }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang-tidy cmake ninja-build g++ \
            libx11-dev libxi-dev libxtst-dev libxinerama-dev libxrandr-dev \
            libxkbcommon-dev libglib2.0-dev libssl-dev \
            libgl1-mesa-dev
      - name: Install Qt
        uses: jurplel/install-qt-action@a9c63c7c123f3069cff414e7e482d95dfa9d8125 # v4
        with:
          version: "6.9.3"
          cache: false
      - name: Generate compile commands
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DSKIP_BUILD_TESTS=ON
      - name: Run clang-tidy (errors only)
        run: |
          set -euo pipefail
          find src/ -regex '.*\.\(cpp\|cc\|cxx\)' -print0 \
            | xargs -0 -r clang-tidy -p build \
              --checks='-*,bugprone-*,cert-*,cppcoreguidelines-*,clang-analyzer-*,-modernize-use-trailing-return-type' \
              --warnings-as-errors='*' \
            2>&1 | tee clang-tidy-output.txt
      - name: Upload results
        if: ${{ always() && env.SYNERGY_VERSION_RELEASE == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: clang-tidy-results
          path: clang-tidy-output.txt
          if-no-files-found: ignore

  cppcheck:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.analyze }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cppcheck
      - name: Run cppcheck
        run: |
          cppcheck \
            --enable=warning,style,performance,portability \
            --std=c++20 \
            --suppress=missingIncludeSystem \
            --inline-suppr \
            --error-exitcode=1 \
            --output-file=cppcheck-results.txt \
            --language=c++ \
            src/
          cat cppcheck-results.txt
      - name: Upload results
        if: ${{ always() && env.SYNERGY_VERSION_RELEASE == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: cppcheck-results
          path: cppcheck-results.txt
          if-no-files-found: ignore

  codeql:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.analyze }}
    permissions:
      actions: read
      contents: read
      security-events: write
    runs-on: ubuntu-latest
    container: debian:trixie-slim
    timeout-minutes: 20
    steps:
      - name: Install container dependencies
        run: |
          apt-get update -qqq > /dev/null
          apt-get install -qqq git > /dev/null
      - name: Checkout
        uses: sithlord48/fancy-checkout@v2
      - name: Install dependencies
        uses: ./.github/actions/install-dependencies
        with:
          like: "debian"
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: cpp
          build-mode: manual
      - name: Build for CodeQL
        run: |
          cmake -B build -G "Ninja" \
            -DCMAKE_BUILD_TYPE=Release \
            -DSKIP_BUILD_TESTS=ON
          cmake --build build -j"$(nproc)"
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4

  sonar:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.analyze && vars.SONAR_SCANNER_ENABLED }}
    runs-on: ubuntu-latest
    container: debian:trixie-slim
    timeout-minutes: 20
    env:
      CPU_CORE_COUNT: 4
    steps:
      - name: Install container dependencies
        run: |
          apt-get update -qqq > /dev/null
          apt-get install -qqq git curl unzip gcovr dirmngr gpg > /dev/null
      - name: Checkout
        uses: sithlord48/fancy-checkout@v2
      - name: Install project dependencies
        uses: ./.github/actions/install-dependencies
        with:
          like: "debian"
      - name: Install Build Wrapper
        uses: SonarSource/sonarqube-scan-action/install-build-wrapper@v6
      - name: Configure
        run: |
          cmake -B build \
            -G "Ninja" \
            -DCMAKE_BUILD_TYPE="Debug" \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DSKIP_BUILD_TESTS=ON \
            -DENABLE_COVERAGE=ON
      - name: Build
        run: |
          build-wrapper-linux-x86-64 --out-dir bw-output cmake --build build -j"${CPU_CORE_COUNT}"
      - name: Test coverage
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          targets=$(cmake --build build --target help)
          mapfile -t tests < <(printf '%s\n' "$targets" | grep -o "^coverage-[^:]*")
          if [ "${#tests[@]}" -eq 0 ]; then
            echo "Error: No coverage targets found"
            exit 1
          fi
          for i in "${tests[@]}"; do
            cmake --build build --target "$i"
          done
      - name: Get coverage report paths
        id: coverage-paths
        run: |
          paths=$(find build -maxdepth 1 -name 'coverage-*.xml' -type f -printf '%p\n' | sort | paste -sd, -)
          if [ -z "$paths" ]; then
            echo "Error: No coverage files found"
            exit 1
          fi
          echo "csv=$paths" >> "$GITHUB_OUTPUT"
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v8
        with:
          args: >
            -Dproject.settings=config/sonar-project.properties
            -Dsonar.coverageReportPaths=${{ steps.coverage-paths.outputs.csv }}
            -Dsonar.cfamily.threads=${{ env.CPU_CORE_COUNT }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  valgrind:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.analyze }}
    runs-on: ubuntu-latest
    container: debian:trixie-slim
    timeout-minutes: 30
    steps:
      - name: Install container dependencies
        run: |
          apt-get update -qqq > /dev/null
          apt-get install -qqq git valgrind > /dev/null
      - name: Checkout
        uses: sithlord48/fancy-checkout@v2
      - name: Install dependencies
        uses: ./.github/actions/install-dependencies
        with:
          like: "debian"
      - name: Configure
        run: cmake -B build -G "Ninja"
      - name: Build
        run: cmake --build build -j8
      - name: Valgrind unit tests
        id: unittests
        uses: ./.github/actions/run-valgrind
        with:
          executable: ctest --test-dir  "build/src/unittests"
      - name: Set job summary
        run: |
          backticks='```'
          message=$(cat <<EOF
          ## Valgrind summary

          ### Unit tests
          $backticks
          ${{ steps.unittests.outputs.summary }}
          $backticks
          EOF
          )
          echo "$message" >> "$GITHUB_STEP_SUMMARY"
  # ---------------------------------------------------------------------------
  # 5. Gate. Branch protection watches this job. A skipped job counts as
  # success: platform filters and analyze=false skip work on purpose.
  # ---------------------------------------------------------------------------
  ci-passed:
    runs-on: ubuntu-latest
    needs:
      [
        get-version,
        lint-clang,
        lint-encoding,
        build-windows,
        build-macos,
        build-linux,
        build-flatpak,
        github-release,
        clang-tidy,
        cppcheck,
        codeql,
        sonar,
        valgrind,
      ]
    if: always()

    steps:
      # 'skipped' is treated as passing because the plan step skips platforms
      # on purpose (push/PR skip Windows, macOS and Flatpak; snapshot honors
      # platform). package-type=release and a published Release do not skip a
      # platform. A failed job is still a failure. get-version never filters
      # out, so requiring it catches a build skipped by its failure.
      # lint-clang and lint-encoding have no platform filter: a failed lint used
      # to be invisible here (builds skip via needs:, skipped counted as ok).
      # Always require both. No checkout: this job only inspects needs.* results.
      - name: Check all jobs passed or were intentionally skipped
        run: |
          ok() {
            [[ "$1" == "success" || "$1" == "skipped" ]]
          }
          if ok "${{needs.get-version.result}}" \
             && ok "${{needs.lint-clang.result}}" \
             && ok "${{needs.lint-encoding.result}}" \
             && ok "${{needs.build-windows.result}}" \
             && ok "${{needs.build-macos.result}}" \
             && ok "${{needs.build-linux.result}}" \
             && ok "${{needs.build-flatpak.result}}" \
             && ok "${{needs.github-release.result}}" \
             && ok "${{needs.clang-tidy.result}}" \
             && ok "${{needs.cppcheck.result}}" \
             && ok "${{needs.codeql.result}}" \
             && ok "${{needs.sonar.result}}" \
             && ok "${{needs.valgrind.result}}"; then
            printf '\342\234\205 CI passed\n' > "$GITHUB_STEP_SUMMARY"
          else
            exit 1
          fi


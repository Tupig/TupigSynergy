# Default CodeQL scan for the Security tab. Separate from the analyze=true
# CodeQL job in ci.yml, which builds with CMake by hand inside Debian.
# Automatic: push and pull request to main, plus Monday 00:00 UTC.
# Manual: workflow_dispatch, for a re-run that is not tied to a new commit.
# A newer push or PR cancels the older scan of that same ref. The weekly run
# and a manual run do not cancel each other or an in-progress push scan.

name: CodeQL

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 0 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  security-events: write
  contents: read

jobs:
  analyze:
    name: Analyze C++
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Initialize CodeQL
        uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4
        with:
          languages: cpp

      - name: Autobuild
        uses: github/codeql-action/autobuild@24c54180a607b1449ed407dd24f251e4e9147c8d # v4

      - name: Analyze
        uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4